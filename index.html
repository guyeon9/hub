<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구연 관리도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* 레이아웃: 상단 고정 머리말 + 탭 메뉴 + 본문. 안건·공고는 좌측 입력, 우측 서류 미리보기 */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#1B2530; --ink2:#46515E; --muted:#76808B; --line:#D9DFE1;
  --accent:#1D5B6B; --accent-ink:#FFFFFF; --accent-soft:#E2EFF2; --seal:#B5372B; --ok:#2C7A4B; --warn:#A8700F; --warn-soft:#FBF1DC; --ok-soft:#E3F1E8;
  --paper:#FFFFFF; --paper-ink:#141414; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Gowun Batang','Noto Serif KR','Batang',serif;
  --base:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A2229; --surface2:#202A32; --ink:#E7ECEF; --ink2:#B2BCC5; --muted:#8A95A0; --line:#2C363F;
  --accent:#6DB7C9; --accent-ink:#0E1A1F; --accent-soft:#1B3038; --seal:#E26A5C; --ok:#6CC08A; --warn:#E3B24E; --warn-soft:#352D18; --ok-soft:#1C3125;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A2229; --surface2:#202A32; --ink:#E7ECEF; --ink2:#B2BCC5; --muted:#8A95A0; --line:#2C363F;
  --accent:#6DB7C9; --accent-ink:#0E1A1F; --accent-soft:#1B3038; --seal:#E26A5C; --ok:#6CC08A; --warn:#E3B24E; --warn-soft:#352D18; --ok-soft:#1C3125;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}

/* 머리말 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.7rem 0 .2rem}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.seal{width:2.5rem;height:2.5rem;flex:none;border:2px solid var(--seal);border-radius:.3rem;color:var(--seal);display:grid;grid-template-rows:1fr 1fr;
  place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;line-height:1;transform:rotate(-3deg);background:transparent}
.seal span{display:block}
.brand b{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:.2rem .8rem;font-size:.82rem;color:var(--ink2);max-width:100%}
.chip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ok);display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:.2rem .65rem;font-size:.78rem;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.segl{font-size:.75rem;color:var(--muted);margin-right:.3rem}
nav.tabs{display:flex;gap:.1rem;overflow-x:auto;max-width:1180px;margin:0 auto;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;padding:.65rem .9rem;font-size:.95rem;cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--seal)}
nav.tabs small{display:inline-block;margin-left:.3rem;font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:.6rem;padding:0 .4rem;vertical-align:middle}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:.3rem}

main{padding-top:1.6rem}
.h-title{font-size:1.7rem;margin-bottom:.3rem}
.lead{color:var(--ink2);margin:0 0 1.4rem;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.card + .card{margin-top:1rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card h2 small{font-family:var(--font-ui);font-weight:400;color:var(--muted);font-size:.78rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem .9rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem .9rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.3rem;align-items:start}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.3rem;align-items:start}
@media (max-width:900px){.split,.home-grid{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.chip{margin-left:0}}
label.f{display:block;min-width:0}
label.f>span{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:.2rem}
label.f>em{display:block;font-style:normal;font-size:.72rem;color:var(--muted);margin-top:.2rem}
input[type=text],input[type=date],input[type=time],input[type=url],input[type=month],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.45rem .6rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:4.2rem;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:.55rem;padding:.45rem .9rem;font-size:.88rem;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);font-weight:500}
.btn.sm{padding:.2rem .6rem;font-size:.78rem}
.btn.danger{border-color:var(--seal);color:var(--seal);background:transparent}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.82rem}
.rk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:.5rem}
.rk-stat{border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;display:flex;flex-direction:column;gap:.05rem;background:var(--surface)}
.rk-stat b{font-size:1.3rem;line-height:1.2}.rk-stat span{font-size:.84rem;font-weight:600;color:var(--ink)}.rk-stat small{font-size:.74rem;color:var(--muted)}
.rk-stat.bad{border-color:var(--seal)}.rk-stat.bad b{color:var(--seal)}.rk-stat.warn{background:var(--warn-soft)}.rk-stat.warn b{color:var(--warn)}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:.6rem;padding:.6rem .8rem;font-size:.83rem;color:var(--ink2)}

/* 홈 바로가기 */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media (max-width:520px){.mods{grid-template-columns:minmax(0,1fr)}}
.mod{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid var(--line);border-radius:.7rem;padding:.8rem .9rem;background:var(--surface)}
.mod:hover{border-color:var(--accent)}
.mod:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mod b{display:block;font-family:var(--font-display);font-size:1.02rem}
.mod span{display:block;font-size:.8rem;color:var(--ink2);margin-top:.15rem}
.mod span.tag{display:inline-block;margin-top:0;margin-left:.4rem;font-size:.68rem}
.tag{display:inline-block;font-size:.68rem;border-radius:.6rem;padding:0 .5rem;margin-left:.4rem;vertical-align:middle;font-family:var(--font-ui);font-weight:500}
.tag.on{background:var(--ok-soft);color:var(--ok)}
.tag.link{background:var(--accent-soft);color:var(--accent)}
.tag.soon{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.next{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;font-size:.92rem}
.next dt{color:var(--muted)} .next dd{margin:0}

/* 위원 표 */
.mem{display:grid;grid-template-columns:3.2rem minmax(0,1fr) minmax(0,1fr) auto;gap:.4rem;align-items:center;margin-bottom:.4rem}
.mem.head{font-size:.75rem;color:var(--muted);margin-bottom:.2rem}

/* 안건 카드 */
.ag{border:1px solid var(--line);border-radius:.7rem;padding:.8rem .9rem;background:var(--surface)}
.ag+.ag{margin-top:.7rem}
.ag-h{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
.ag-n{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.ag-h input{flex:1}
.ag-h select{width:auto}
.ag-tools{display:flex;gap:.3rem;margin-top:.5rem;justify-content:flex-end}

/* 미리보기 */
.pv-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.7rem}
.pv-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.3rem .8rem;font-size:.85rem;cursor:pointer;color:var(--ink2)}
.pv-tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.lt-steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:.35rem;margin:1.1rem 0 .55rem;padding:0;list-style:none}
.lt-steps button{width:100%;display:flex;align-items:center;gap:.45rem;border:1px solid var(--line);background:var(--surface);border-radius:.6rem;padding:.45rem .55rem;cursor:pointer;color:var(--ink2);font-size:.85rem;text-align:left;line-height:1.25}
.lt-steps button b{flex:none;display:inline-grid;place-items:center;width:1.55rem;height:1.55rem;border-radius:50%;background:var(--surface2);color:var(--ink2);font-size:.8rem}
.lt-steps button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.lt-steps button[aria-pressed="true"] b{background:var(--accent);color:var(--accent-ink)}
#lttabs button.lt-off{display:none}
@media (max-width:640px){.lt-steps{grid-template-columns:repeat(5,minmax(3.2rem,1fr))}.lt-steps button{flex-direction:column;justify-content:center;text-align:center;padding:.4rem .2rem;font-size:.72rem}}
.pv-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid #cfd5d8;box-shadow:var(--shadow);padding:2rem 1.8rem;margin-bottom:1rem;font-size:.9rem;line-height:1.7;overflow-x:auto;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif}
.paper p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.paper table{border-collapse:collapse;width:100%;table-layout:fixed;margin:.4rem 0}
.paper td{border:1px solid #444;padding:.25rem .45rem;vertical-align:middle;overflow-wrap:anywhere}
.paper table.nob td{border:0}
.paper td p{white-space:pre-wrap}
.pgno{font-size:.7rem;color:var(--muted);margin:-.5rem 0 1rem;text-align:right}
.sms{width:100%;min-height:14rem;font-size:.95rem}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.chk li{display:flex;gap:.6rem;align-items:flex-start;border-radius:.6rem;padding:.55rem .75rem;font-size:.9rem}
.chk li.ok{background:var(--ok-soft)} .chk li.warn{background:var(--warn-soft)}
.chk b{flex:none;width:1.2rem;text-align:center}
.chk li.ok b{color:var(--ok)} .chk li.warn b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.6rem;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.road{margin:0;padding-left:1.2rem}
.road li{margin:.35rem 0}
@media (prefers-reduced-motion:no-preference){.card,.mod{transition:border-color .15s}}

/* 서류 공통 미리보기 */
.docv{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;line-height:1.5;color:var(--paper-ink)}
.docv p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.docv table{border-collapse:collapse;table-layout:fixed;margin:0;max-width:100%}
.docv table.jc-c{margin-left:auto;margin-right:auto}
.docv table.jc-r{margin-left:auto}
.docv td{border:1px solid #333;padding:2px 5px;vertical-align:middle;white-space:pre-wrap;overflow-wrap:anywhere}
.docv td.nob{border-color:transparent}
.docv td.dbl{border:3px double #333}
.docv td.db{border-bottom:3px double #333}
.paper.pborder{outline:1px solid #111;outline-offset:-12px}
.doc{background:var(--paper);border:1px solid #cfd5d8;box-shadow:var(--shadow);padding:2.2rem 2rem;overflow-x:auto}
.doc .pbreak{border-top:2px dashed #b9c2c7;margin:1.6rem -2rem 1.4rem;position:relative}
.doc .pbreak::after{content:"쪽 나눔";position:absolute;right:.6rem;top:-.8rem;font-size:10px;color:#7d878e;background:var(--paper);padding:0 .3rem}
.doc [contenteditable]{outline:none;cursor:text;border-radius:2px}
.doc [contenteditable]:hover{background:#eef6f8}
.doc [contenteditable]:focus{background:#e2f0f4;box-shadow:inset 0 0 0 2px #1D5B6B}
.doc .chg{background:#fff4c2}
.doc [id^="sp-h-"]{scroll-margin-top:9rem}
.sp-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:1.2rem;align-items:start}
.sp-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 7.6rem);max-height:calc(100vh - 9rem);overflow:auto}
@media (max-width:900px){.sp-wrap{grid-template-columns:minmax(0,1fr)}.sp-side{position:static;max-height:none}}
.toc{display:grid;gap:.05rem;margin-top:.4rem}
.toc a{display:block;color:var(--ink2);text-decoration:none;font-size:.82rem;padding:.12rem .2rem;border-radius:.3rem}
.toc a:hover{background:var(--surface2);color:var(--ink)}
.toc a.h2{padding-left:1rem;font-size:.76rem;color:var(--muted)}
.legend{display:inline-block;width:.9rem;height:.9rem;background:#fff4c2;border:1px solid #e3cf75;vertical-align:-2px;border-radius:2px}
.kt{width:100%;border-collapse:collapse;font-size:.85rem}
.kt th,.kt td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
.kt th{color:var(--muted);font-weight:500;font-size:.75rem}
.tag{white-space:nowrap}
.rl-hits{display:grid;gap:.35rem;max-height:18rem;overflow:auto}
.rl-hit{display:flex;gap:.6rem;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .6rem}
.rl-hit span{min-width:0}
.rl-hit small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26rem}
.rl-cur{white-space:pre-wrap;font-family:inherit;font-size:.82rem;background:var(--surface2);border:1px solid var(--line);border-radius:.4rem;padding:.5rem;margin:.3rem 0 0;max-height:14rem;overflow:auto}
.rl-steps{margin:0;padding-left:1.3rem;display:grid;gap:.6rem}
.rl-steps p{margin:.2rem 0 0;font-size:.85rem;color:var(--ink2)}
.paper.land{font-size:.8rem}
.risk-frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:.6rem;background:#fff}
.dg-sum{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.1rem}.dg-sum span{background:var(--surface2);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .65rem;font-size:.82rem}.dg-sum b{font-size:1rem;color:var(--ink)}
.dg-sec{margin:0 0 1.6rem}.dg-sec h3{font-size:1rem;margin:0 0 .5rem}.dg-sec h3 small{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:.3rem}
.dg mark{background:var(--warn-soft);color:var(--warn);border-radius:.2rem;padding:0 .15rem;font-weight:600}
.tag.bad{background:var(--warn-soft);color:var(--warn)}
.dg-lv{border-left:3px solid var(--line);padding:.15rem 0 .15rem .75rem;margin:.7rem 0}.dg-lv.l1{border-color:var(--warn)}.dg-lv.l3{border-color:var(--accent)}
.dg-item{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem}.dg-item>div{min-width:0;overflow-wrap:anywhere}.dg-item p{margin:.15rem 0 0;color:var(--ink2)}.dg-item .btn,.dg-item>.tag{flex:none}
.bd-big{font-size:1rem;margin:0 0 .5rem}.bd-res .kt th{width:7.5rem;white-space:nowrap}
.kt.nw th,.kt.nw td{white-space:nowrap}
</style>
</head>
<body>

<div id="app"></div>

 훼손된 경우","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"라. 이용금지 : 시설물의 이용자에게 위해·위험을 발생시킬 수 있는 이상 징후가 있거나 위해가 발생한 경우","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"- 관리주체는 시설물의 구조상 공중의 안전에 미치는 영향이 중대하여 긴급한 사용제한·사용금지 등의 조치를 취하여야 한다.","al":"both","ind":[1500,200,0],"sp":[0,50,312]},{"k":"p","t":"- 시설 또는 설비의 진단결과 안전관리상 지장이 있다고 판단될 때 이용제한 조치를 적극적으로 실시한다.","al":"both","ind":[1500,200,0],"sp":[0,50,312]},{"k":"p","t":"- 이용제한 조치 후 보수가 필요한 시설물에 대해서는 보수공사 실시한 후 완료되면 시설물 사용 및 유지관리 한다.","al":"both","ind":[1500,200,0],"sp":[0,50,312]},{"k":"p","t":"(2) 시설별 안전관리책임자 또는 안전관리자는 안전점검을 실시한 경우에는 점검결과를 기록하여 안전관리총괄책임자에게 보고하고 자체 보관하여야 한다.","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"(3) 안전관리총괄책임자는 이상이 있는 시설물에 대하여 입주자대표회의에 보고 및 정비보완하고 조치사항을 기록·유지한다.","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"(4) 시설별 안전관리책임자 또는 안전관리자는 시설물을 수리하는 경우 수리자로 하여금 다음 각목의 안전조치를 취하도록 한 후 작업하도록 하여야 한다.","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"가. \"수리 중 사용금지\"라는 표시","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 수리의 소요시간 표시","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"다. 수리자명 및 연락처(전화번호 등) 표시","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"(5) 시설별 안전관리책임자 또는 안전관리자는 안전점검 결과 위해의 우려가 있거나 위해가 발생한 경우에는 먼저 이용금지 조치를 취한 후 안전관리총괄책임자에게 보고하여야 한다.","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"5) 안전점검 결과 위해시설물 발견 시 보고","sz":24,"b":1,"ind":[140,0,0],"kn":1,"h":2,"sp":[260,120,0]},{"k":"p","t":"시설별 안전관리책임자 또는 안전관리자는 위해·위험을 발생시킬 수 있는 이상 징후가 있거나 위해가 발생한 경우에는 이용금지 등 안전조치를 취한 후 안전관리총괄책임자에게 신속한 방법으로 6하 원칙에 의하여 간단명료하게 보고한다.","al":"both","ind":[300,0,0]},{"k":"p","t":"(1) 긴급보고 : 이용금지 등 안전조치를 취한 후, 안전관리책임자에게 신속한 방법으로 6하 원칙에 의하여 간단명료하게 보고한다.","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"가. 야간이나 휴일에는 당직책임자에게 즉시 보고하고 당직책임자는 사태를 판단하여 적절한 조치를 지시하고 안전관리총괄책임자에게 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 관계관서의 협조가 요구될 경우 당직책임자는 신속히 관계기관에 통보하여 협조를 구하고 안전관리총괄책임자에게 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"(2) 중간보고","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"가. 위해시설물의 안전관리책임자는 긴급보고 후 24시간 내에 상세한 상황을 서면으로 안전관리총괄책임자에게 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 서면보고를 접수한 안전관리총괄책임자는 필요한 사항을 재검토 후 지시한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"(3) 사고처리 후 보고","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"가. 위해 요소의 제거는 근무자 전원이 합심 협력하여 처리하고 처리종료와 동시에 서면으로 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 처리에 지연이 있을 시는 지연사유를 안전관리총괄책임자에게 보고하여 사고처리에 차질이 없도록 한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"6) 보수 업무","sz":24,"b":1,"ind":[140,0,0],"kn":1,"h":2,"sp":[260,120,0]},{"k":"p","t":"당해 공동주택 시설물에 대하여 위해상태의 발견에 따른 보수업무는 다음에 의한다.","al":"both","ind":[300,0,0]},{"k":"p","t":"(1) 하자보수 기간이 경과 하지 않은 경우","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"① 하자신고 및 접수처리","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"가. 관리사무소 : 하자접수부에 하자사항을 기록하고 하자보수책임업체에 급한 사항은 전통으로 통보하며, 위급한 사항이 아닐 경우 서면으로 통보한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 하자보수책임업체 : 하자보수 접수 후 위급사항은 24시간 내에 현장에 도착하여 응급조치를 시행하고 위급사항이 아닐 경우 3일 이내에 조치하여 관리사무소에 처리결과를 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"다. 각동 경비초소 : 경비초소 일지에 기록하고 관리사무소에 보고","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"② 각 분야별 안전관리책임자는 하자보수 사항에 대한 감독 및 점검을 실시한다.","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"③ 하자보수 기간이 장기간이 소요될 경우 그 진척 사항을 담당 안전관리책임자는 수시로 중간보고 하여야 한다.","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"(2) 하자보수 기간이 경과한 경우","al":"both","ind":[720,500,0],"sp":[0,50,312]},{"k":"p","t":"① 위해상태가 자체기술 인력으로 보수 가능한 경우","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"가. 보수 후 시설별 안전관리자 또는 안전관리책임자는 처리사항을 기록하여 자체 보관하고 안전관리총괄책임자에게 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"나. 안전관리총괄책임자는 처리사항을 입주자대표회의에 보고한다.","al":"both","ind":[1040,380,0],"sp":[0,50,312]},{"k":"p","t":"② 위해상태의 보수 범위가 자체기술 인력으로 처리할 수 없는 경우에는 안전관리 총괄책임자는 즉시 입주자대표회의에 보고하고 절차에 따라 처리한다.","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"7) 보수업무 책임한계","sz":24,"b":1,"ind":[140,0,0],"kn":1,"h":2,"sp":[260,120,0]},{"k":"p","t":"위해시설물에 대한 보수업무의 책임 범위는 다음과 같이 구분한다.","al":"both","ind":[300,0,0]},{"k":"p","t":"1. 관리사무소 : 공동시설물과 부대시설물에 대한 보수업무 및 감독","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"2. 입주자 : 전유부분의 시설물의 보수업무(입주자에 의한 시설물의 훼손부분)","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"3. 각 시설물의 시공업체 : 해당분야 시설에 대한 하자보수업무(법정 책임기간 내)","al":"both","ind":[820,380,0],"sp":[0,50,312]},{"k":"p","t":"8) 예산확보 계획","sz":24,"b":1,"ind":[140,0,0],"kn":1,"h":2,"sp":[260,120,0]},{"k":"p","t":"「공동주택관리법 시행령」 제26조 제1항에 따라 사업계획 및 예산에 의하여 수선유지비 항목 중 시설유지비와 안전점검비 및 재해예방비 계정으로 입주자대표회의의 승인을 받아 필요한 예산을 확보한다.","al":"both","ind":[300,0,0]},{"k":"p","t":"","sp":[0,600,0]},{"k":"p","t":"        년        월        일","sz":24,"al":"center","sp":[200,120,0],"e":1},{"k":"p","t":"{{APT}} 관리사무소장  {{DIRS}}  (인)","sz":26,"b":1,"al":"center","sp":[120,0,0]}]</script>

 headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"EVEN\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><hp:pageBorderFill type=\"ODD\" borderFillIDRef=\"1\" textBorder=\"PAPER\" headerInside=\"0\" footerInside=\"0\" fillArea=\"PAPER\"><hp:offset left=\"1417\" right=\"1417\" top=\"1417\" bottom=\"1417\"/><\/hp:pageBorderFill><\/hp:secPr><hp:ctrl><hp:colPr id=\"\" type=\"NEWSPAPER\" layout=\"LEFT\" colCount=\"1\" sameSz=\"1\" sameGap=\"0\"/><\/hp:ctrl>", "prv": "", "cp0": "<hh:charPr id=\"0\" height=\"1000\" textColor=\"#000000\" shadeColor=\"none\" useFontSpace=\"0\" useKerning=\"0\" symMark=\"NONE\" borderFillIDRef=\"2\"><hh:fontRef hangul=\"1\" latin=\"1\" hanja=\"1\" japanese=\"1\" other=\"1\" symbol=\"1\" user=\"1\"/><hh:ratio hangul=\"100\" latin=\"100\" hanja=\"100\" japanese=\"100\" other=\"100\" symbol=\"100\" user=\"100\"/><hh:spacing hangul=\"0\" latin=\"0\" hanja=\"0\" japanese=\"0\" other=\"0\" symbol=\"0\" user=\"0\"/><hh:relSz hangul=\"100\" latin=\"100\" hanja=\"100\" japanese=\"100\" other=\"100\" symbol=\"100\" user=\"100\"/><hh:offset hangul=\"0\" latin=\"0\" hanja=\"0\" japanese=\"0\" other=\"0\" symbol=\"0\" user=\"0\"/><hh:underline type=\"NONE\" shape=\"SOLID\" color=\"#000000\"/><hh:strikeout shape=\"NONE\" color=\"#000000\"/><hh:outline type=\"NONE\"/><hh:shadow type=\"NONE\" color=\"#C0C0C0\" offsetX=\"10\" offsetY=\"10\"/><\/hh:charPr>", "pp0": "<hh:paraPr id=\"0\" tabPrIDRef=\"0\" condense=\"0\" fontLineHeight=\"0\" snapToGrid=\"1\" suppressLineNumbers=\"0\" checked=\"0\" textDir=\"LTR\"><hh:align horizontal=\"JUSTIFY\" vertical=\"BASELINE\"/><hh:heading type=\"NONE\" idRef=\"0\" level=\"0\"/><hh:breakSetting breakLatinWord=\"KEEP_WORD\" breakNonLatinWord=\"BREAK_WORD\" widow <script>
/* 관리규약 개정 도우미 — 계산 부분 (화면과 분리) */
var RC = (function () {
  'use strict';
  var HEAD = /^\s*제\s*(\d+)\s*조(?:\s*의\s*(\d+))?\s*[(【\[（]\s*([^)】\]）]{1,40}?)\s*[)】\]）]\s*(.*)$/;
  var CHAP = /^\s*제\s*\d+\s*장(\s+\S.*|\s*)$/;
  var BUCHIK = /^\s*[<〈《(\[]?\s*부\s*칙(?![가-힣])/;

  function key(no, sub) { return String(no) + (sub ? '-' + sub : ''); }
  function headOf(no, sub, title) { return '제' + no + '조' + (sub ? '의' + sub : '') + '【' + title + '】'; }
  function label(a) { return '제' + a.no + '조' + (a.sub ? '의' + a.sub : '') + (a.title ? '(' + a.title + ')' : ''); }

  /* 붙여넣은 규약 전문 → 조문 목록 */
  function parse(text) {
    var lines = String(text || '').replace(/\r/g, '').split('\n');
    var arts = [], cur = null, pendingCh = '', maxBody = 0;
    for (var i = 0; i < lines.length; i++) {
      var ln = lines[i].replace(/ /g, ' ').replace(/\s+$/, '');
      if (!ln.trim()) continue;
      var m = ln.match(HEAD);
      if (m) {
        var rest = m[4].trim(), toc = false;
        if (/^\d{1,3}$/.test(rest)) { rest = ''; toc = true; }
        // 본문이 끝난 뒤 조문 번호가 처음부터 다시 시작하면 별도 규정으로 보고 멈춤
        if (maxBody >= 20 && +m[1] < maxBody - 10) break;
        cur = { no: +m[1], sub: m[2] ? +m[2] : 0, title: m[3].trim(), ch: pendingCh, lines: rest ? [rest] : [], toc: toc };
        if (rest && cur.no > maxBody) maxBody = cur.no;
        pendingCh = '';
        arts.push(cur);
        continue;
      }
      if (CHAP.test(ln) && ln.trim().length < 40) { pendingCh = ln.trim().replace(/\s+/g, ' ').replace(/\d+$/, '').trim(); continue; }
      if (BUCHIK.test(ln) && ln.trim().length < 40) {
        var withBody = arts.filter(function (a) { return a.lines.length; }).length;
        if (withBody >= 3) break;
        continue;
      }
      if (cur && !cur.toc) { cur.lines.push(ln.trim()); if (cur.no > maxBody) maxBody = cur.no; }
    }
    // 목차(본문 없음)와 중복 조문 정리: 본문이 가장 긴 것을 남김
    var best = {}, order = [];
    arts.forEach(function (a) {
      var k = key(a.no, a.sub), len = a.lines.join('').length;
      if (!best[k]) { best[k] = a; order.push(k); }
      else if (len > best[k].lines.join('').length) best[k] = a;
    });
    var out = order.map(function (k) {
      var a = best[k];
      return { k: k, no: a.no, sub: a.sub, title: a.title, head: headOf(a.no, a.sub, a.title), ch: a.ch || '', body: a.lines.join('\n') };
    }).filter(function (a) { return a.body; });
    out.sort(function (x, y) { return x.no - y.no || x.sub - y.sub; });
    return out;
  }

  /* 단어 단위 비교 (LCS) */
  function tokens(s) { return String(s).match(/\s+|[0-9]+|[A-Za-z]+|[가-힣]+|./g) || []; }
  function lcs(a, b) {
    var n = a.length, m = b.length;
    if (n * m > 400000) return null;
    var dp = new Array(n + 1);
    for (var i = 0; i <= n; i++) dp[i] = new Uint16Array(m + 1);
    for (i = n - 1; i >= 0; i--) for (var j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var L = [], R = [];
    i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { L.push([a[i], 0]); R.push([b[j], 0]); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { L.push([a[i], 1]); i++; }
      else { R.push([b[j], 1]); j++; }
    }
    while (i < n) L.push([a[i++], 1]);
    while (j < m) R.push([b[j++], 1]);
    return { L: L, R: R };
  }
  function merge(seq) {
    var out = [];
    seq.forEach(function (t) {
      var last = out[out.length - 1];
      // 공백만 바뀐 경우는 밑줄을 긋지 않음
      var mark = t[1] && /\S/.test(t[0]) ? 1 : (t[1] && last && last[1] ? 1 : 0);
      if (last && last[1] === mark) last[0] += t[0]; else out.push([t[0], mark]);
    });
    return out;
  }
  function wordDiff(a, b) {
    var r = lcs(tokens(a), tokens(b));
    if (!r) return { L: [[a, 1]], R: [[b, 1]] };
    return { L: merge(r.L), R: merge(r.R) };
  }

  /* 줄 단위 맞추기 */
  function lineLcs(a, b) {
    var n = a.length, m = b.length, dp = [];
    for (var i = 0; i <= n; i++) { dp[i] = []; for (var j = 0; j <= m; j++) dp[i][j] = 0; }
    for (i = n - 1; i >= 0; i--) for (j = m - 1; j >= 0; j--) dp[i][j] = a[i] === b[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    var ops = []; i = 0; j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { ops.push({ t: 'eq', a: a[i], b: b[j] }); i++; j++; }
      else if (dp[i + 1][j] >= dp[i][j + 1]) { ops.push({ t: 'del', a: a[i] }); i++; }
      else { ops.push({ t: 'ins', b: b[j] }); j++; }
    }
    while (i < n) ops.push({ t: 'del', a: a[i++] });
    while (j < m) ops.push({ t: 'ins', b: b[j++] });
    return ops;
  }
  var MARK = /^\s*([①-⑳]|\d{1,2}\.|[가-하]\.|\d{1,2}\)|[가-하]\))/;
  function markerOf(line) { var m = String(line).match(MARK); return m ? m[1] : ''; }
  function lvlOf(mk) { return /[①-⑳]/.test(mk) ? 1 : /^\d+\.$/.test(mk) ? 2 : /^[가-하]\.$/.test(mk) ? 3 : mk ? 4 : 0; }
  function splitLines(s) { return String(s || '').split('\n').map(function (x) { return x.trim(); }).filter(Boolean); }

  /* 한 조문의 3단 비교 칸 만들기
     반환: {left:[[runs]], right:[[runs]]} — 각 원소가 한 문단, runs = [[글, 밑줄여부]] */
  function compare(am, opt) {
    opt = opt || {};
    var collapse = opt.collapse !== false;
    var head = am.head;
    if (am.type === '신설') {
      return { left: [[['<신설>', 0]]], right: [[[head, 0]]].concat(splitLines(am.next).map(function (l) { return [[l, 1]]; })) };
    }
    if (am.type === '삭제') {
      return { left: [[[head, 0]]].concat(splitLines(am.cur).map(function (l) { return [[l, 1]]; })), right: [[[head.replace(/【.*】/, '') + ' 삭제', 1]]] };
    }
    var a = splitLines(am.cur), b = splitLines(am.next);
    var nextHead = am.nextHead || head;
    var ops = lineLcs(a, b);
    // 지운 줄과 새 줄을 짝지어 단어 비교
    var rows = [];
    for (var i = 0; i < ops.length; i++) {
      var o = ops[i];
      if (o.t === 'del' && ops[i + 1] && ops[i + 1].t === 'ins') { rows.push({ t: 'chg', a: o.a, b: ops[i + 1].b }); i++; }
      else rows.push(o);
    }
    var left = [[[head, 0]]], right = [[[nextHead, nextHead !== head ? 1 : 0]]];
    var run = [];
    function flushRun() {
      if (!run.length) return;
      if (!collapse) { run.forEach(function (l) { right.push([[l, 0]]); }); run = []; return; }
      // 같은 단계 번호끼리 묶어 "② ∼ ④ (현행과 같음)"
      var groups = [], g = null;
      run.forEach(function (l) {
        var mk = markerOf(l), lv = lvlOf(mk);
        if (g && g.lv === lv && lv) { g.last = mk; g.n++; }
        else { g = { lv: lv, first: mk, last: mk, n: 1, text: l }; groups.push(g); }
      });
      groups.forEach(function (gr) {
        if (!gr.lv) { right.push([[gr.text, 0]]); return; }
        var t = gr.n > 1 ? gr.first + ' ∼ ' + gr.last + ' (현행과 같음)' : gr.first + ' (현행과 같음)';
        right.push([[t, 0]]);
      });
      run = [];
    }
    rows.forEach(function (r) {

function tK(t){if(!t)return '  시';var a=t.split(':');var h=+a[0],m=+a[1];return h+'시'+(m?' '+m+'분':'');}
function lines(s){return String(s||'').split('\n').map(function(x){return x.replace(/\s+$/,'');}).filter(function(x){return x.trim();});}
function dash(l){return /^[-※·•▣]/.test(l.trim())?l.trim():'- '+l.trim();}
function resText(a){
  var r=lines(a.resolution);if(r.length)return r.join('\n');
  return {'가결':'원안대로 가결함.','접수':'보고를 원안대로 접수함.','부결':'부결됨.','보류':'보류함.'}[a.result]||'';
}
function orgName(){return state.complex.name+state.complex.council;}
function ML(){var p=parseIso(state.meeting.date);return p?{yy:String(p.y).slice(2),y:p.y,m:p.m}:{yy:'  ',y:'    ',m:'  '};}
function tokens(s){
  var c=state.complex,dir=c.director||'';
  return String(s).replace(/\{\{APT\}\}/g,c.name).replace(/\{\{DIRS\}\}/g,dir.split('').join(' ')).replace(/\{\{DIR\}\}/g,dir);
}

/* ═════════ 서류 모델 (공통 형식) ═════════
   문단 {k:'p', t | r:[[글,크기,굵게,밑줄,색]], sz, b, u, co, al:'center'|'right'|'both', sp:[앞,뒤,줄], ind:[왼,내어,첫줄], kn, pb, h}
   표   {k:'t', w:[열너비], c:가운데, jc:'right'|'left', rows:[{c:[칸], h:[높이,규칙], hd}]}
   칸   {t | p:[문단], sz, b, co, al:'c'|'l'|'r', cs, rs, f:채움, va:'top', bd:'n'|'d'|'db'}
   크기는 반 포인트(21 = 10.5pt), 간격은 1/20pt */
function P(t,o){var x={k:'p',t:t};o=o||{};for(var k in o)x[k]=o[k];if(!x.sp)x.sp=[0,0,0];return x;}
function GAP(after){return {k:'p',t:'',sz:10,sp:[0,after||0,0]};}

function checks(){
  var m=state.meeting,out=[],md=parseIso(m.date),nd=parseIso(m.noticeDate),rd=parseIso(m.resultDate);
  if(md&&nd){
    var diff=Math.round((md.t-nd.t)/86400000),need=+m.noticeLead||0;
    out.push({ok:diff>=need&&diff>=0,t:'개최공고일부터 회의일까지 '+diff+'일입니다.'+(need?' 입력한 기준은 '+need+'일 전 공고입니다.':'')+' 관리규약의 소집 공고 기한과 맞는지 확인하세요.'});
  }else out.push({ok:false,t:'회의일과 개최공고일을 입력하면 공고 기한을 계산합니다.'});
  out.push({ok:state.agendas.length>0&&state.agendas.every(function(a){return a.title.trim();}),t:state.agendas.length?'안건 '+state.agendas.length+'건의 제목이 입력되어 있습니다.':'안건이 없습니다.'});
  if(md&&rd)out.push({ok:rd.t>=md.t,t:rd.t>=md.t?'결과공고일이 회의일 이후입니다.':'결과공고일이 회의일보다 앞섭니다. 날짜를 확인하세요.'});
  out.push({ok:!!(m.noticeNo&&m.resultNo),t:(m.noticeNo&&m.resultNo)?'공고 번호가 모두 입력되어 있습니다.':'개최공고 또는 결과공고의 공고 번호가 비어 있습니다.'});
  var blanks=state.committee.filter(function(x){return (x.r||x.n)&&!String(x.n||'').trim();}).length;
  out.push({ok:blanks===0,t:blanks?'회의록 서명란에 성명이 비어 있는 위원이 '+blanks+'명 있습니다. 홈 화면의 위원 명단에서 입력하세요.':'위원 명단 성명이 모두 입력되어 있습니다.'});
  var noRes=state.agendas.filter(function(a){return !lines(a.resolution).length;}).length;
  if(noRes)out.push({ok:true,t:'의결내용을 비운 안건 '+noRes+'건은 선택한 결과에 맞춰 기본 문구가 들어갑니다.'});
  return out;
}

/* ═════════ 미리보기 렌더 (공통) ═════════ */
var PX=13/21; // 반포인트 → px 환산 (본문 10.5pt = 13px)
function tw(v){return (v/20*1.333*0.93).toFixed(1)+'px';}
function paraStyle(p){
  var sp=p.sp||[0,80,312],ind=p.ind||[0,0,0],al=p.al;
  var st='font-size:'+((p.sz||(p.r&&p.r[0]&&p.r[0][1])||21)*PX).toFixed(1)+'px;';
  if(al)st+='text-align:'+(al==='both'?'justify':al)+';';
  if(sp[0])st+='margin-top:'+tw(sp[0])+';';
  if(sp[1])st+='margin-bottom:'+tw(sp[1])+';';
  if(sp[2])st+='line-height:'+Math.max(1.15,sp[2]/240*1.2).toFixed(2)+';';
  var left=ind[0]||0,hang=ind[1]||0,first=ind[2]||0;
  if(left)st+='padding-left:'+tw(left)+';';
  if(hang)st+='text-indent:-'+tw(hang)+';';else if(first)st+='text-indent:'+tw(first)+';';
  if(p.b)st+='font-weight:700;';if(p.u)st+='text-decoration:underline;';if(p.co)st+='color:#'+p.co+';';
  if(p.h===1)st+='font-weight:700;';
  return st;
}
function runsHtml(p,txt){
  if(txt!=null)return esc(tokens(txt));
  if(p.r)return p.r.map(function(r){var s=esc(tokens(r[0]));var st='';if(r[1]&&r[1]!==(p.r[0][1]))st+='font-size:'+(r[1]*PX).toFixed(1)+'px;';if(r[2])st+='font-weight:700;';if(r[3])st+='text-decoration:underline;';if(r[4])st+='color:#'+r[4]+';';return st?'<span style="'+st+'">'+s+'</span>':s;}).join('');
  return esc(tokens(p.t||''));
}
function cellText(c){return c.t!=null?c.t:null;}
function cellStyle(c){
  var st='text-align:'+({c:'center',l:'left',r:'right'}[c.al||'c'])+';font-size:'+((c.sz||19)*PX).toFixed(1)+'px;';
  if(c.b)st+='font-weight:700;';if(c.co)st+='color:#'+c.co+';';if(c.f)st+='background:#'+c.f+';';
  if(c.va==='top')st+='vertical-align:top;';
  return st;
}
function cellClass(c){return c.bd==='n'?'nob':c.bd==='d'?'dbl':c.bd==='db'?'db':'';}
/* opt.edit: 편집 가능, opt.edits: 고친 값, opt.key: 블록 번호 접두 */
function blocksHtml(blocks,opt){
  opt=opt||{};var ed=opt.edits||{};var out=[];
  blocks.forEach(function(b,i){
    var key=String(i);
    if(b.k==='p'){
      if(b.pb&&i>0)out.push('<div class="pbreak" aria-hidden="true"></div>');
      var has=Object.prototype.hasOwnProperty.call(ed,key);
      var txt=has?ed[key]:(b.r?null:(b.t||''));
      var inner=runsHtml(b,txt);
      var ce=opt.edit&&!b.h?' contenteditable="true" data-k="'+key+'"':'';
      var id=opt.edit&&b.h?' id="sp-h-'+i+'"':'';
      var cls=has?' class="chg"':'';
      out.push('<p'+id+ce+cls+' style="'+paraStyle(b)+'">'+(inner||'&#8203;')+'</p>');
      return;
    }
    var tot=b.w.reduce(function(a,x){return a+x;},0);
    var widthPct=Math.min(100,tot/9638*100);
    var h='<table class="'+(b.c?'jc-c':b.jc==='right'?'jc-r':'')+'" style="width:'+widthPct.toFixed(1)+'%"><colgroup>'+b.w.map(function(x){return '<col style="width:'+(x/tot*100).toFixed(2)+'%">';}).join('')+'</colgroup>';
    b.rows.forEach(function(r,ri){
      h+='<tr'+(r.h?' style="height:'+tw(r.h[0])+'"':'')+'>';
      r.c.forEach(function(c,ci){
        var ck=i+'.'+ri+'.'+ci,has=Object.prototype.hasOwnProperty.call(ed,ck);
        var attrs=(c.cs?' colspan="'+c.cs+'"':'')+(c.rs?' rowspan="'+c.rs+'"':'');
        var cls=cellClass(c)+(has?' chg':'');
        var inner;
        if(c.p&&!has)inner=c.p.map(function(p){return '<p style="'+paraStyle(p)+'">'+runsHtml(p,p.r?null:p.t)+'</p>';}).join('');
        else inner=esc(tokens(has?ed[ck]:(c.t||'')));
        var ce=(opt.edit&&c.t!=null)?' contenteditable="true" data-k="'+ck+'"':'';
        h+='<td'+attrs+ce+(cls.trim()?' class="'+cls.trim()+'"':'')+' style="'+cellStyle(c)+'">'+inner+'</td>';
      });
      h+='</tr>';
    });
    out.push(h+'</table>');
  });
  return out.join('');
}
function blockPlain(blocks){
  var out=[];
  blocks.forEach(function(b){
    if(b.k==='p'){var t=b.t!=null?b.t:(b.r||[]).map(function(r){return r[0];}).join('');if(t||!b.pb)out.push(tokens(t));}
    else b.rows.forEach(function(r){out.push(r.c.map(function(c){var t=c.t!=null?c.t:(c.p||[]).map(function(p){return p.t;}).join(' ');return tokens(String(t)).replace(/\n+/g,' / ');}).join(' | '));});
  });
  return out.join('\n').replace(/\n{3,}/g,'\n\n');
}
function pagesOf(blocks){var pages=[[]];blocks.forEach(function(b){if(b.pb&&pages[pages.length-1].length)pages.push([]);pages[pages.length-1].push(b);});return pages;}
function previewHtml(kind,docs){
  if(kind==='sms'){return '<textarea class="sms" id="sms-text" aria-label="안내 문자">'+esc(docs.sms.text)+'</textarea>';}
  if(kind==='check'){return '<ul class="chk">'+checks().map(function(c){return '<li class="'+(c.ok?'ok':'warn')+'"><b>'+(c.ok?'✓':'!')+'</b><span>'+esc(c.t)+'</span></li>';}).join('')+'</ul><p class="muted" style="margin-top:.8rem">점검은 입력한 값만 비교하는 참고용입니다. 공고 기한과 의결 절차는 우리 단지 관리규약을 기준으로 확인하세요.</p>';}
  var d=docs[kind],pages=pagesOf(d.blocks);
  return pages.map(function(p,i){return '<div class="paper docv'+(d.opt.border?' pborder':'')+'">'+blocksHtml(p)+'</div>'+(pages.length>1?'<div class="pgno">'+(i+1)+' / '+pages.length+' 쪽</div>':'');}).join('');
}

/* ═════════ DOCX 생성 (공통) ═════════ */
var FONT='맑은 고딕';
function xe(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
function rPr(sz,b,u,co){return '<w:rPr><w:rFonts w:ascii="'+FONT+'" w:eastAsia="'+FONT+'" w:hAnsi="'+FONT+'" w:cs="'+FONT+'"/>'+(b?'<w:b/>':'')+(co?'<w:color w:val="'+co+'"/>':'')+'<w:sz w:val="'+sz+'"/><w:szCs w:val="'+sz+'"/>'+(u?'<w:u w:val="single"/>':'')+'</w:rPr>';}
function runX(t,sz,b,u,co){t=tokens(t);if(t==='')return '';return '<w:r>'+rPr(sz,b,u,co)+'<w:t xml:space="preserve">'+xe(t)+'</w:t></w:r>';}
function pX(p,txt,cellMode){
  var sp=p.sp||(cellMode?[0,0,252]:[0,80,312]),ind=p.ind,al=p.al;
  var ppr='<w:pPr>'+(p.h?'<w:pStyle w:val="Heading'+p.h+'"/>':'')+(p.kn?'<w:keepNext/>':'')+(p.pb?'<w:pageBreakBefore/>':'')+
    '<w:spacing w:before="'+(sp[0]||0)+'" w:after="'+(sp[1]||0)+'"'+(sp[2]?' w:line="'+sp[2]+'" w:lineRule="auto"':'')+'/>'+
    (ind&&(ind[0]||ind[1]||ind[2])?'<w:ind w:left="'+(ind[0]||0)+'"'+(ind[1]?' w:hanging="'+ind[1]+'"':(ind[2]?' w:firstLine="'+ind[2]+'"':''))+'/>':'')+
    (al?'<w:jc w:val="'+(al==='both'?'both':al)+'"/>':'')+'</w:pPr>';
  var body='';

function saveFile(name,blob){
  if(blob&&blob.type==='application/hwp+zip')name=String(name).replace(/\.docx$/i,'.hwpx');
  var getDl=Promise.resolve(null);
  try{if(window.claude&&window.claude.use)getDl=window.claude.use('downloads');}catch(e){}
  return getDl.catch(function(){return null;}).then(function(dl){
    if(dl){
      return dl.save({filename:name,data:blob}).then(function(){toast('저장했습니다: '+name);},function(e){toast(e&&e.code==='declined'?'저장을 취소했습니다.':'이 화면에서는 저장할 수 없습니다. 복사 버튼을 이용해 주세요.');});
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();

  });
}

function plainOf(b){return b.t!=null?b.t:(b.r||[]).map(function(r){return r[0];}).join('');}

function spFillList(){
  var out=[],h1='',h2='',h3='',cap='';
  SPT.forEach(function(b,i){
    if(b.k==='p'){
      var t=tokens(plainOf(b));
      if(b.h===1){h1=t;h2='';h3='';cap='';}else if(b.h===2){h2=t;h3='';cap='';}else if(b.h===3){h3=t;cap='';}
      else if(b.al==='center'&&b.b&&t.length<40&&/^\[표|^\[/.test(t)){cap=t;}
      if(b.e)out.push({k:String(i),loc:[h1,h2,h3].filter(Boolean).map(function(x){return cut(x,24);}).join(' > ')+' > 문장',cur:curVal(String(i))});
      return;
    }
    var ncol=b.w.length,occ=[],grid=[];
    b.rows.forEach(function(r,ri){
      occ[ri]=occ[ri]||{};grid[ri]=grid[ri]||{};var col=0;
      r.c.forEach(function(c,ci){
        while(occ[ri][col])col++;
        var cs=c.cs||1,rs=c.rs||1;
        for(var q=0;q<rs;q++){occ[ri+q]=occ[ri+q]||{};grid[ri+q]=grid[ri+q]||{};for(var j=0;j<cs;j++){occ[ri+q][col+j]=true;grid[ri+q][col+j]={c:c,ri:ri,ci:ci};}}
        c._lc=col;col+=cs;
      });
    });
    var hdr=0;while(hdr<b.rows.length&&(b.rows[hdr].hd||b.rows[hdr].c.every(function(c){return c.f;})))hdr++;
    function colHead(lc){var a=[];for(var r=0;r<hdr;r++){var g=grid[r]&&grid[r][lc];if(g){var t=cut(tokens(g.c.t||''),18);if(t&&a.indexOf(t)<0)a.push(t);}}return a.join(' ');}
    var where=[h1,h2,h3||cap].filter(Boolean).map(function(x){return cut(x,24);}).join(' > ');
    b.rows.forEach(function(r,ri){
      r.c.forEach(function(c,ci){
        if(!c.e)return;
        var lc=c._lc,left='';
        for(var x=lc-1;x>=0&&!left;x--){var g=grid[ri][x];if(g&&g.c!==c){var t=cut(tokens(g.c.t||''),18);if(t&&!/^\d{1,3}$/.test(t))left=t;else if(t&&x===0)left=t+'번';}}

      });
    });
  });
  return out;
}

function readRuleFile(file){

  out.push({ok:!!p.boardDate,t:p.boardDate?'입주자대표회의 제안 의결일: '+dShort(p.boardDate):'입주자대표회의 제안 의결일을 넣으세요(시행령 제3조제1호). 제안서에 들어갑니다.'});
  out.push({ok:!!p.noticeDate,t:p.noticeDate?'개정(안) 공고와 요약서 개별 통지: '+dShort(p.noticeDate):'개정(안) 공고일을 넣으세요. 공고와 함께 요약서를 세대마다 알려야 합니다(시행령 제20조제5항).'});
  if(!T)out.push({ok:false,t:'찬반 결과(찬성·반대·무효 세대수)를 ④에 넣으면 과반수 충족 여부를 확인합니다.'});
  else if(T.pass==null)out.push({ok:false,t:'전체 세대수를 홈의 단지 정보에 넣어야 과반수를 계산할 수 있습니다.'});
  else out.push({ok:T.pass,t:T.pass?'찬성 '+LT.won(T.y)+'세대로 기준('+T.need+'세대)을 넘었습니다.':'찬성 '+LT.won(T.y)+'세대로 기준('+T.need+'세대)에 '+(T.need-T.y)+'세대 모자랍니다. 개정이 확정되지 않았으니 신고 대상이 아닙니다.'});
  if(T&&T.u&&T.y+T.n+T.b>T.u)out.push({ok:false,t:'찬성·반대·무효 합계가 전체 세대수보다 많습니다. 집계를 다시 확인하세요.'});
  if(p.fixDate){var due=addDays(p.fixDate,30),dd=Math.round((parseIso(due).t-parseIso(td).t)/864e5);out.push({ok:dd>=0,t:dd>=0?'신고 기한 '+dShort(due)+' (오늘부터 '+dd+'일 남음)':'신고 기한 '+dShort(due)+'이 '+(-dd)+'일 지났습니다. 바로 신고하고 늦어진 사유를 정리해 두세요.'});}
  else out.push({ok:false,t:'개정 확정일을 넣으면 신고 기한(30일)을 계산합니다(시행령 제21조).'});
  out.push({ok:R().am.length>0,t:'제출 서류: ① 개정 제안서 ② 입주자등의 동의서 — "제안서" 탭에서 ①을 만들 수 있습니다(시행규칙 제6조제2항제1호).'});
  return out;
}
function rulesAfter(){return ['구청의 수리 통지(7일 이내, 없으면 다음 날 수리 간주)를 받은 날을 기록합니다.','개정 규약 전문을 단지 홈페이지·동별 게시판에 알리고 관리사무소에 비치합니다.','입주자등이 열람·복사를 요청하면 응합니다(시행령 제20조제6항).','개정 조문과 관련된 내부 규정(선거관리, 공동체 생활 등)과 서식이 바뀌어야 하는지 확인합니다.','다음 준칙 개정에 대비해 이번 대비표·집계표·신고서 사본을 한 묶음으로 보관합니다.'];}
function rulesIcs(){
  var p=R().proc,apt=state.complex.name,ev=[];
  var d8=function(iso){return String(iso).replace(/-/g,'');};
  var add=function(s,e,t,memo){if(!s)return;ev.push({s:s,e:addDays(e||s,1),t:t,m:memo||''});};
  add(p.boardDate,null,'[관리규약] 입대의 개정(안) 제안 의결','시행령 제3조제1호');
  add(p.noticeDate,null,'[관리규약] 개정(안) 공고·요약서 통지','시행령 제20조제5항');
  add(p.voteStart,p.voteEnd,'[관리규약] 찬반 기간',p.method||'');
  var fx=p.fixDate||p.voteEnd;
  if(fx){add(addDays(fx,23),null,'[관리규약] 개정 신고 1주 전','신고 기한 '+dShort(addDays(fx,30)));add(addDays(fx,30),null,'[관리규약] 개정 신고 기한','시행령 제21조: 개정된 날부터 30일 이내');}
  if(!ev.length)return '';
  var stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d+Z$/,'Z'),esc2=function(t){return String(t).replace(/[\;,]/g,function(m){return '\\'+m;});};
  return ['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//guyeon-hub//rules//KO','CALSCALE:GREGORIAN'].concat(ev.map(function(e,i){return ['BEGIN:VEVENT','UID:rules-'+d8(e.s)+'-'+i+'@guyeon-hub','DTSTAMP:'+stamp,'DTSTART;VALUE=DATE:'+d8(e.s),'DTEND;VALUE=DATE:'+d8(e.e),'SUMMARY:'+esc2(apt+' '+e.t),'DESCRIPTION:'+esc2(e.m),'BEGIN:VALARM','TRIGGER;RELATED=START:PT9H','ACTION:DISPLAY','DESCRIPTION:'+esc2(e.t),'END:VALARM','END:VEVENT'].join('\r\n');})).concat(['END:VCALENDAR']).join('\r\n')+'\r\n';
}
function rulesChecks(){
  var r=R(),p=r.proc,out=[];
  out.push({ok:!!r.base,t:r.base?'현행 관리규약 조문 '+r.base.arts.length+'개를 넣었습니다.':'현행 관리규약을 아직 넣지 않았습니다.'});
  out.push({ok:r.am.length>0,t:r.am.length?'개정할 조문이 '+r.am.length+'개입니다.':'개정할 조문이 없습니다.'});
  r.am.forEach(function(a){
    if(a.type==='개정'&&String(a.next).trim()===String(a.cur).trim()&&(a.nextTitle||a.title)===a.title)out.push({ok:false,t:amLabel(a)+': 개정(안)이 현행과 같습니다.'});
    if(!String(a.reason||'').trim())out.push({ok:false,t:amLabel(a)+': 개정 사유가 비어 있습니다.'});
    if(a.type==='신설'&&r.base&&r.base.arts.some(function(x){return x.k===a.k;}))out.push({ok:false,t:amLabel(a)+': 이미 있는 조문 번호입니다. 번호를 바꾸거나 "개정"으로 하세요.'});
  });
  if(r.base){
    var c=RC.checkRefs(r.base.arts,r.am);
    c.toDeleted.forEach(function(x){out.push({ok:false,t:RC.label(x.from)+'에 삭제되는 '+RC.refLabel(x.to)+' 인용이 있습니다. 함께 고쳐야 하는지 확인하세요.'});});
    c.unknown.forEach(function(x){out.push({ok:false,t:x.head+' 개정(안)에 규약에 없는 '+RC.refLabel(x.ref)+'가 나옵니다. 법령 조문이면 괜찮고, 규약 조문이면 번호를 확인하세요.'});});
    if(!c.toDeleted.length&&!c.unknown.length&&r.am.length)out.push({ok:true,t:'조문 번호 인용에서 어긋나는 곳을 찾지 못했습니다.'});
  }
  if(!state.complex.region)out.push({ok:false,t:'시·도를 고르면 준칙 이름이 맞게 들어갑니다(홈의 단지 정보 또는 ② 지역 준칙).'});
  if(r.jun.arts){var jr=junRows(),usedK={},usedT={};r.am.forEach(function(a){usedK[a.k]=1;usedT[RC.normT(a.nextTitle||a.title)]=1;});var nd=jr.filter(function(x){return x.st==='다름'&&!usedK[x.b.k];}).length,no=jr.filter(function(x){return x.st==='준칙에만'&&!usedT[RC.normT(x.j.title)];}).length;out.push({ok:!nd&&!no,t:(nd||no)?'준칙 대조: 아직 검토하지 않은 다른 조문 '+nd+'개, 준칙에만 있는 조문 '+no+'개가 있습니다. "준칙 대조" 탭에서 반영할지 정하세요.':'준칙 대조: 다른 조문은 모두 개정 대상에 넣었거나 검토했습니다.'});}
  out.push({ok:!!lines(p.purpose).length,t:lines(p.purpose).length?'공고 기재사항 1: 개정 목적이 입력되어 있습니다.':'공고 기재사항 1: 개정 목적을 입력하세요(시행령 제20조제5항제1호).'});
  out.push({ok:!!lines(p.junDiff).length,t:lines(p.junDiff).length?'공고 기재사항 3: 준칙과 달라진 내용이 입력되어 있습니다.':'공고 기재사항 3: 관리규약준칙과 달라진 내용을 입력하세요. 없으면 "없음"으로 적습니다(제20조제5항제3호).'});
  var ds=[p.boardDate,p.noticeDate,p.voteStart,p.voteEnd].map(parseIso);
  if(ds.every(Boolean)){var okOrder=ds[0].t<=ds[1].t&&ds[1].t<=ds[2].t&&ds[2].t<=ds[3].t;out.push({ok:okOrder,t:okOrder?'의결일, 공고일, 찬반 기간의 순서가 맞습니다.':'의결일 → 공고일 → 찬반 시작 → 찬반 종료 순서가 맞지 않습니다.'});}
  else out.push({ok:false,t:'의결일, 공고일, 찬반 기간을 입력하면 일정과 신고 기한을 계산합니다.'});
  return out;
}

  var push=function(s){

    var lic='';
    if(m){lic=m[1].replace(/\s/g,'');s=m[1]+' '+({'등록증':'등록','허가증':'허가','면허증':'면허'}[m[2]]||'신고')+' 업체';}
    else if(/(사본|증명서|\d\s*부\b|제출)/.test(s)&&!/(자본금|실적)/.test(s))return;
    if(s.length<6||s.length>220||/제\s*(26|18)\s*조|참가자격의\s*제한|공고문\s*참조|첨부/.test(s))return;
    var key=s.replace(/\s/g,'');if(seen[key])return;seen[key]=1;
    var t=/(산출|노무비|최저임금|일반관리비|이윤|단가|퇴직|4대\s*보험|사회보험)/.test(s)?'calc':/(자본금|실적|세대\s*이상|단지\s*이상|기술\s*인력|보유)/.test(s)?'lim':'qual';

    else if(/([가-힣·]+업)\s*(등록증|허가증|신고증|신고필증|면허증)/.test(s))push(s);
  });

function wageCalc(b){
  var w=b.wage,h=num(w.hourly),rate=(num(w.pension)+num(w.health)+num(w.health)*num(w.ltc)/100+num(w.emp)+num(w.acc))/100;
  var exp=num(w.uniform)+num(w.supplies)+num(w.edu)+num(w.check);
  var rows=b.staff.map(function(s){var n=num(s.n)||0,base=h*num(s.monthH),night=h*0.5*num(s.nightH),ann=w.annual?h*num(s.dayH)*15/12:0;
    var wages=base+night+ann,sev=wages/12,ins=wages*rate,labor=wages+sev+ins,per=labor+exp;
    return {s:s,n:n,base:base,night:night,ann:ann,wages:wages,sev:sev,ins:ins,labor:labor,exp:exp,per:per,tot:per*n,ltot:labor*n};});
  var labor=rows.reduce(function(a,r){return a+r.ltot;},0),direct=rows.reduce(function(a,r){return a+r.tot;},0);
  var mg=labor*num(w.mgmt)/100,pf=labor*num(w.profit)/100,month=Math.floor(direct+mg+pf);
  return {rows:rows,rate:rate,labor:labor,direct:direct,mg:mg,pf:pf,month:month};
}

function scoreCalc(b){
  var J=BD.judge(b),hi=J.award==='최고낙찰제'||BD.kind(b.kind).aw.indexOf('최고낙찰제')>=0;
  var pi=(b.eval||[]).filter(function(x){return x.k==='price';})[0],pts=pi?evalCritPts(pi.crit):[30];
  var cos=b.cos.map(function(c,i){return {i:i,c:c,price:num(c.price)};});
  var sorted=cos.filter(function(x){return x.price;}).slice().sort(function(a,z){return hi?z.price-a.price:a.price-z.price;});
  var rank={},r=0,last=null;sorted.forEach(function(x,j){if(x.price!==last){r=j+1;last=x.price;}rank[x.i]=r;});
  cos.forEach(function(x){x.pr=rank[x.i]?pts[Math.min(rank[x.i]-1,pts.length-1)]:0;x.tot=x.pr;(b.eval||[]).forEach(function(e){if(e.k!=='price')x.tot+=num((x.c.s||{})[e.k]);});x.tot=Math.round(x.tot*10)/10;});
  var ord=cos.slice().sort(function(a,z){return z.tot-a.tot||(hi?z.price-a.price:a.price-z.price);});
  ord.forEach(function(x,j){x.rk=j+1;});
  var tie=ord.length>1&&ord[0].tot===ord[1].tot&&ord[0].price===ord[1].price;
  return {cos:cos,ord:ord,tie:tie,hi:hi};
}

    if(!j.ok)throw new Error(j.error||'없음');

    j.list=j.list.filter(function(x){return !/테스트|test/i.test(x.t);});
    var C=unitCache();j.list.forEach(function(x){var c=C[x.code];if(c){if(!x.hh&&c.hh)x.hh=c.hh;if(!x.ev&&c.ev)x.ev=c.ev;}if(x.hh||x.ev)unitPut(x.code,x.hh,x.ev);});
    bdAwJ={j:j,unit:unit};paintAw();fillUnits();

      '<div style="overflow-x:auto;margin-top:.4rem"><table class="kt nw"><thead><tr><th>구분</th><th>단지</th><th>계약명</th><th>금액</th><th>기간</th><th>'+(unit==='elev'?'대수':'세대')+'</th>'+(svc?'<th>'+uName+'당 월</th>':'')+'</tr></thead><tbody>'+

    b.amtMode=k.g==='용역'?'month':'total';b.amt=String(+x[5]||'');

        var late=x.due&&x.due<j.today;return '<tr><td style="white-space:nowrap'+(late?';color:var(--seal);font-weight:700':'')+'">'+esc(x.due||'-')+(late?'<br><small>기한 지남</small>':'')+'</td><td><b>'+esc(x.t)+'</b><br><small>'+esc(x.m)+'</small>'+(x.temp?'<br><small class="muted">임시조치: '+esc(x.temp)+'</small>':'')+'</td><td>'+esc(x.who)+'</td><td><small>'+esc(x.budget)+'</small></td></tr>';}).join('')+'</tbody></table></div>':'<p class="muted">진행 중인 개선대책이 없습니다.</p>')+

function rkAct(act){
  if(act==='rkreload'){paintRiskSum(true);return true;}
  if(act!=='rkagenda'&&act!=='rkshare')return false;
  riskLoad().then(function(j){
    var L=j.imp.list,y=j.annual.year;
    if(act==='rkagenda'){
      var need=L.filter(function(x){return /입대의|의결|구입|공사|견적|설치/.test(x.budget+x.m);});
      if(!need.length){toast('입대의 의결이 필요한 개선대책이 없습니다.');return;}
      var t='위험성평가 개선대책 이행(개선공사·물품 구입) 승인의 건';
      var dd=['근거: 산업안전보건법 제36조, 같은 법 시행규칙 제37조의4 (개선대책 수립 내용 및 이행 결과 기록)',
        y+'년 정기 위험성평가'+(j.annual.base?'('+y+'. '+rDot(j.annual.base)+' 실시)':'')+'에서 나온 개선대책 중 비용이 드는 '+need.length+'건',
      ].concat(need.map(function(x,i){return (i+1)+'. '+x.t+': '+x.m+(x.due?' (예정 '+x.due+')':'')+(x.budget?' — '+x.budget:'');}))
       .concat(['완료 전까지 임시조치를 유지하며, 완료 후 완료일·개선 후 사진을 기록합니다.']).join('\n');
      state.agendas.push({title:t,result:'가결',discuss:dd,resolution:'위험성평가 개선대책 '+need.length+'건의 이행(견적 비교 후 시행)을 원안대로 의결함.'});
      save();toast('안건·공고에 "'+t+'"을(를) 넣었습니다. 금액은 견적 후 고쳐 쓰세요.');
    }else{
      var txt='[위험성평가 결과 공유]\n\n'+(j.apt||state.complex.name)+' 관리사무소는 '+y+'년 정기 위험성평가를 실시하였으며, 그 결과를 아래와 같이 알려 드립니다.\n\n'+
        '1. 실시일: '+(j.annual.base?rDot(j.annual.base).replace(/^/,y+'. '):y+'.  .  .')+' 현장 순회점검(근로자 참여)\n'+
        '2. 평가 범위: 현장점검 '+(j.annual.chk||'')+'개 항목 및 추가 위험요인\n'+
        '3. 개선이 필요한 위험요인과 대책\n'+(L.length?L.map(function(x){return ' - '+x.t+': '+x.m+(x.due?' (예정 '+x.due+')':'');}).join('\n'):' - 없음')+'\n'+
        '4. 완료 전 임시조치\n'+(L.filter(function(x){return x.temp;}).map(function(x){return ' - '+x.t+': '+x.temp;}).join('\n')||' - 없음')+'\n\n'+
        '작업 전 TBM에서 해당 위험요인과 안전수칙을 계속 확인하겠습니다. 위험한 곳이나 아차사고는 QR 신고 또는 관리사무소로 알려 주십시오.\n\n'+
        '근거: 산업안전보건법 제36조, 같은 법 시행규칙 제37조의3(결과 공유)\n\n'+(j.apt||state.complex.name)+' 관리사무소장 '+(j.director||state.complex.director||'');
      copyText(txt);
    }
  }).catch(function(e){toast(riskErr(e));});
  return true;
}

    S.rows.forEach(function(r){if(!r.d||!/^\d{4}-\d\d-\d\d$/.test(r.d))return;if(/^(pub|con|ins4|due|open|notice)$/.test(r.k))L.push({t:nm+': '+r.t,due:r.d,src:'입찰·계약',law:r.law,how:r.note});});

function calAct(act,a){
  var c=CQ();
  if(act==='caldone'){var k=a.dataset.key,id=a.dataset.id,t=calToday();
    if(a.dataset.cu!=null){var x=c.custom[+a.dataset.cu];if(x)x.last=t;}
    else if(/^(elev|play|water|septic|risk)$/.test(id))c.last[id]=t;
    else c.done[k]=t;
    saveNow();calRefresh();toast('완료로 표시했습니다('+t+').'+(c.last[id]===t?' 다음 기한을 오늘부터 다시 계산했습니다.':''));return true;}
  if(act==='calundo'){delete c.done[a.dataset.key];saveNow();calRefresh();return true;}
  if(act==='calset'){c.ui.v='set';saveNow();calPaint();return true;}
  if(act==='calcuadd'){c.custom.push({name:'',cyc:'',last:'',law:''});saveNow();calPaint();return true;}
  if(act==='calcudel'){c.custom.splice(+a.dataset.i,1);saveNow();calPaint();return true;}
  if(act==='calics'){var t2=calToday(),L=calList(t2,CAL.addM(t2,12)).filter(function(x){return x.due&&!c.done[x.key]&&(!a.dataset.lite||!/^(tankM|disclose)$/.test(x.id));});
    if(!L.length){toast('넣을 일정이 없습니다.');return true;}
    saveFile('법정업무달력_'+state.complex.name+'.ics',new Blob([CAL.ics(L,state.complex.name)],{type:'text/calendar'}));return true;}
  if(act==='caldocx'){makeDocx(calDocBlocks(),{footer:1,margins:[1134,1134,1134,1134]}).then(function(bl){return saveFile('법정업무_연간계획표_'+state.complex.name+'.docx',bl);}).catch(function(){toast('문서를 만들지 못했습니다.');});return true;}
  return false;
}

function ltChart(S){
  var W=720,H=250,pl=62,pr=10,pt=12,pb=26,rows=S.rows,n=rows.length;if(!n)return '';
  var mx=0,mn=0;rows.forEach(function(r){mx=Math.max(mx,r.cost,r.close);mn=Math.min(mn,r.close);});if(mx<=0)mx=1;
  var sc=function(v){return pt+(mx-v)/(mx-mn)*(H-pt-pb);},bw=(W-pl-pr)/n,z=sc(0),g='';
  for(var k=0;k<=4;k++){var v=mn+(mx-mn)*k/4,y=sc(v);g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+y.toFixed(1)+'" y2="'+y.toFixed(1)+'" stroke="var(--line)" stroke-width="1"/><text x="'+(pl-6)+'" y="'+(y+4).toFixed(1)+'" text-anchor="end" font-size="10" fill="var(--muted)">'+(Math.round(v/1e7)/10)+'억</text>';}
  if(mn<0)g+='<rect x="'+pl+'" y="'+z.toFixed(1)+'" width="'+(W-pl-pr)+'" height="'+(H-pb-z).toFixed(1)+'" fill="var(--seal)" opacity=".07"/>';
  g+='<line x1="'+pl+'" x2="'+(W-pr)+'" y1="'+z.toFixed(1)+'" y2="'+z.toFixed(1)+'" stroke="var(--ink2)" stroke-width="1"/>';
  var pts=[];
  rows.forEach(function(r,i){var x=pl+i*bw,bh=Math.max(0,z-sc(r.cost));
    if(r.cost>0)g+='<rect x="'+(x+bw*.2).toFixed(1)+'" y="'+(z-bh).toFixed(1)+'" width="'+(bw*.6).toFixed(1)+'" height="'+bh.toFixed(1)+'" rx="2" fill="var(--accent)" opacity=".55"/>';
    pts.push((x+bw/2).toFixed(1)+','+sc(r.close).toFixed(1));
    if(n<=30&&(i%Math.ceil(n/12)===0||i===n-1))g+='<text x="'+(x+bw/2).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" fill="var(--muted)">'+String(r.y).slice(2)+'</text>';
  });
  g+='<polyline points="'+pts.join(' ')+'" fill="none" stroke="var(--ink)" stroke-width="2"/>';
  rows.forEach(function(r,i){var x=pl+i*bw,cy=sc(r.close);g+='<circle cx="'+(x+bw/2).toFixed(1)+'" cy="'+cy.toFixed(1)+'" r="3" fill="'+(r.close<0?'var(--seal)':'var(--ink)')+'" stroke="var(--surface)" stroke-width="1.5"/><rect x="'+x.toFixed(1)+'" y="'+pt+'" width="'+bw.toFixed(1)+'" height="'+(H-pt-pb)+'" fill="transparent"><title>'+r.y+'년 · 공사비 '+LT.eok(r.cost)+' · 연말 잔액 '+LT.eok(r.close)+'</title></rect>';});
  return '<svg viewBox="0 0 '+W+' '+H+'" width="100%" role="img" aria-label="연도별 공사비와 연말 잔액">'+g+'</svg>'+
    '<div class="row muted" style="gap:1rem;font-size:.8rem"><span><i style="display:inline-block;width:.8rem;height:.6rem;background:var(--accent);opacity:.55;border-radius:2px"></i> 그 해 공사비</span><span><i style="display:inline-block;width:.9rem;height:2px;background:var(--ink);vertical-align:middle"></i> 연말 잔액</span><span>막대·점에 마우스를 올리면 금액이 보입니다.</span></div>';
}

function ltUseChecks(){
  var L=LQ(),U=L.use,out=[],amt=ltNum(U.amt),sel=L.items.filter(function(x){return U.ids.indexOf(x.id)>=0;}),pa=sel.reduce(function(s,x){return s+ltNum(x.a);},0);

    if(amt&&pa&&amt>pa*1.1)out.push({ok:0,t:'예정금액이 계획 금액보다 '+Math.round((amt/pa-1)*100)+'% 많습니다. 금액 차이가 크면 다음 정기검토 때 반영하세요.'});
    var cy=new Date().getFullYear();if(+U.y!==cy&&U.date&&+String(U.date).slice(0,4)!==+U.y)out.push({ok:0,t:'계획 연도('+U.y+'년)와 공사 연도가 다릅니다. 시기를 당기거나 미루면 계획 조정(정기검토 또는 수시조정) 필요 여부를 확인하세요.'});}
  else out.push({ok:0,t:'계획에서 고른 항목이 없습니다. 장기수선계획에 없는 공사는 원칙적으로 장충을 쓸 수 없으니, 수시조정(입주자 과반수 서면동의)이나 계획서의 소액지출 기준을 확인하세요.'});
  var sm=sel.length?null:LT.small(amt,U.yearUsed,L.meta.one,L.meta.yr);
  if(sm&&amt)out.push({ok:sm.ok?1:0,t:sm.ok?'계획서 총론의 소액지출 기준 안입니다(1회 '+LT.won(L.meta.one)+'원 미만, 연간 '+LT.won(L.meta.yr)+'원 미만). 계획서에 정한 절차대로 입대의 의결 후 쓰고 다음 검토 때 반영합니다.':'소액지출 기준을 넘습니다('+(!sm.one?'1회 기준 초과':'연간 누적 '+LT.won(ltNum(U.yearUsed)+amt)+'원')+').'});
  out.push({ok:U.meet?1:0,t:U.meet?'입주자대표회의 의결 '+dW(U.meet)+' — 관리주체가 사용계획서를 작성해 의결을 받습니다(영 제31조제5항).':'입주자대표회의 의결일을 넣으세요. 사용계획서는 입대의 의결을 거쳐야 하고, 관리규약에서 입찰공고 전 승인을 정한 경우가 많습니다.'});
  ['name','loc','period','scope','order'].forEach(function(k){if(!String(U[k]||'').trim())out.push({ok:0,t:{name:'1호 명칭·내용',loc:'2호 위치·부위',period:'4호 기간',scope:'5호 범위·예정금액',order:'6호 발주 방법'}[k]+' 칸이 비어 있습니다.'});});
  return out;
}

  var latest={};L.kh.forEach(function(h){if(!h.done&&h.act==='past'&&h.k&&(!latest[h.k]||h.y>latest[h.k].y))latest[h.k]=h;});
  var cy0=new Date().getFullYear(),endY=ltNum(L.meta.end)||9999;
  L.kh.forEach(function(h){if(h.done||h.act==='skip'||!h.k)return;var o=L.fst[h.k]=L.fst[h.k]||{},line=String(h.d).slice(0,7).replace('-','.')+' '+h.t+'('+LT.eok(h.a)+')';
    if(h.act==='past'&&latest[h.k]!==h){line+=' · 더 최근 시행 이력이 있어 기록만';L.hist.push({k:h.k,ks:[h.k],y:h.y,m:'부분',a:h.a,t:'기록: '+line,at:ltToday()});o.memo=(o.memo?o.memo+' / ':'')+line;h.done=1;n++;return;}
    if(h.act==='past'){var smp=L.items.filter(function(x){return LT.fkey(x)===h.k;})[0]||{},cyc0=LT.fullCyc(smp.n,smp.g)||(LT.facilities(L.items).filter(function(f){return f.k===h.k;})[0]||{}).cf||0;
      if(cyc0&&h.y+cyc0<cy0&&!L.items.some(function(x){return LT.fkey(x)===h.k&&x.m!=='부분'&&!x.done&&Math.abs(+x.y-h.y)<=1;})){line+=' · '+(h.y+cyc0)+'년 주기 도래가 이미 지나 현장 확인 필요';L.hist.push({k:h.k,ks:[h.k],y:h.y,m:'전면',a:h.a,t:'기록: '+line,at:ltToday()});o.memo=(o.memo?o.memo+' / ':'')+line;h.done=1;n++;return;}}
    if(h.act==='past'){var sample=L.items.filter(function(x){return LT.fkey(x)===h.k;})[0]||{},cyc=LT.fullCyc(sample.n,sample.g)||(LT.facilities(L.items).filter(function(f){return f.k===h.k;})[0]||{}).cf||0;
      var near=L.items.filter(function(x){return LT.fkey(x)===h.k&&x.m!=='부분'&&!x.done&&Math.abs(+x.y-h.y)<=1;})[0],r;
      if(near)r=LT.applyHist(L.items,h.k,h.y,'전면',h.a);else r=LT.applyPast(L.items,h.k,h.y,cyc);
      msgs.push(r.msg);L.hist.push({k:h.k,ks:[h.k],y:h.y,m:'전면',a:h.a,t:r.msg,at:ltToday()});
      if(r.ok&&r.d){L.items.forEach(function(x){if(LT.fkey(x)===h.k&&!L.why[x.id]&&+x.y>h.y)L.why[x.id]=h.y+'년 전면 시행(K-apt 유지관리이력) 반영'+(cyc?', 주기 '+cyc+'년':'');});}
      line+=' · 주기 반영';var drop=L.items.filter(function(x){return LT.fkey(x)===h.k&&+x.y>endY;}).length;if(drop){L.items=L.items.filter(function(x){return !(LT.fkey(x)===h.k&&+x.y>endY);});msgs.push(drop+'회차가 계획 끝 연도를 넘어 빠짐');}}
    else L.hist.push({k:h.k,ks:[h.k],y:h.y,m:'부분',a:h.a,t:'기록: '+line,at:ltToday()});
    o.memo=(o.memo?o.memo+' / ':'')+line;h.done=1;n++;});
  saveNow();ltPaint();toast(n?n+'건을 반영했습니다.'+(msgs.length?' 주기 반영 '+msgs.length+'건.':''):'반영할 이력이 없습니다.');
}

    else{var d=$('#spdoc');d.innerHTML=blocksHtml(SPT,{edit:1,edits:state.safety.edits});var n=$('#sp-n');if(n)n.textContent=Object.keys(state.safety.edits).length;aiPanel(true);$('#aimsg').textContent=r.ok+'칸을 넣었습니다.'+(r.skip?' 양식에 없는 번호 '+r.skip+'줄은 건너뛰었습니다.':'')+' 노란 칸을 확인하세요.';toast(r.ok+'칸을 계획서에 넣었습니다.');}}
  else if(act==='aiundo'){if(aiUndo){state.safety.edits=aiUndo;aiUndo=null;saveNow();$('#spdoc').innerHTML=blocksHtml(SPT,{edit:1,edits:state.safety.edits});var n2=$('#sp-n');if(n2)n2.textContent=Object.keys(state.safety.edits).length;aiPanel(true);toast('방금 넣은 내용을 되돌렸습니다.');}}
  else if(act==='spreset'){$('#sp-reset').innerHTML='<p class="muted" style="margin:0 0 .4rem">고친 칸 '+Object.keys(state.safety.edits).length+'개를 모두 원래 양식으로 되돌립니다.</p><button type="button" class="btn danger sm" data-act="spreset2">되돌리기</button> <button type="button" class="btn ghost sm" data-act="spresetno">취소</button>';}
  else if(act==='spresetno'){$('#sp-reset').innerHTML='<button type="button" class="btn danger sm" data-act="spreset">고친 내용 되돌리기</button>';}
  else if(act==='spreset2'){state.safety={ver:SP_VER,edits:{}};saveNow();go('safety',true);toast('원래 양식으로 되돌렸습니다.');}
  else if(act==='export'){bkMark();if(tab==='home'){var bn=document.querySelector('.note[style*="--warn"]');if(bn)bn.remove();}saveFile('구연관리도우미_저장_'+new Date().toISOString().slice(0,10)+'.json',new Blob([JSON.stringify(state)],{type:'application/json'}));}
  else if(act==='import'){$('#impfile').click();}
  else if(act==='reset'){$('#resetmsg').innerHTML='입력한 내용과 계획서에서 고친 칸을 모두 지우고 처음 상태로 돌아갑니다. <button type="button" class="btn danger sm" data-act="reset2">지우기</button> <button type="button" class="btn ghost sm" data-act="resetno">취소</button>';}
  else if(act==='resetno'){go('home',true);}
  else if(act==='reset2'){state=defaultState();saveNow();applyFont();paintFont();updateChip();go('home',true);toast('처음 상태로 돌렸습니다.');}
  else if(act==='newmeeting'){
    var p=parseIso(state.meeting.date)||{y:new Date().getFullYear(),m:new Date().getMonth()+1};
    var ny=p.m===12?p.y+1:p.y,nm=p.m===12?1:p.m+1;
    state.agendas=[];state.meeting.date=ny+'-'+String(nm).padStart(2,'0')+'-'+String(p.d||20).padStart(2,'0');
    state.meeting.noticeDate='';state.meeting.resultDate='';state.meeting.resultEnd='';state.meeting.noticeNo='';state.meeting.resultNo='';
    saveNow();go('agenda');toast('새 회의를 시작했습니다. 회의일과 공고일, 공고 번호를 맞춰 주세요.');
  }
}
function onImport(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||o.v!==1||!o.complex)throw 0;state=merge(defaultState(),o);saveNow();applyFont();paintFont();updateChip();go('home',true);toast('저장 파일을 불러왔습니다.');}catch(x){toast('이 허브에서 만든 저장 파일이 아닙니다.');}};
  r.readAsText(f);
}

/* ───────── 시작 ───────── */
applyFont();shell();
var h0=(location.hash||'').replace('#','');
go(h0||'home',true);
window.addEventListener('hashchange',function(){var x=(location.hash||'').replace('#','');if(x&&x!==tab)go(x,true);});
window.addEventListener('beforeunload',saveNow);
})();
</script>
