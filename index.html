<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>구연 관리도우미</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>:root{color-scheme:light}body{margin:0}[hidden]{display:none!important}img{max-width:100%}</style>
<style>
/* 레이아웃: 상단 고정 머리말 + 탭 메뉴 + 본문. 안건·공고는 좌측 입력, 우측 서류 미리보기 */
:root{
  --bg:#F1F3F2; --surface:#FFFFFF; --surface2:#F6F8F7; --ink:#1B2530; --ink2:#46515E; --muted:#76808B; --line:#D9DFE1;
  --accent:#1D5B6B; --accent-ink:#FFFFFF; --accent-soft:#E2EFF2; --seal:#B5372B; --ok:#2C7A4B; --warn:#A8700F; --warn-soft:#FBF1DC; --ok-soft:#E3F1E8;
  --paper:#FFFFFF; --paper-ink:#141414; --shadow:0 1px 2px rgba(20,30,40,.06),0 6px 20px rgba(20,30,40,.06);
  --font-ui:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-display:'Gowun Batang','Noto Serif KR','Batang',serif;
  --base:17px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11171C; --surface:#1A2229; --surface2:#202A32; --ink:#E7ECEF; --ink2:#B2BCC5; --muted:#8A95A0; --line:#2C363F;
  --accent:#6DB7C9; --accent-ink:#0E1A1F; --accent-soft:#1B3038; --seal:#E26A5C; --ok:#6CC08A; --warn:#E3B24E; --warn-soft:#352D18; --ok-soft:#1C3125;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11171C; --surface:#1A2229; --surface2:#202A32; --ink:#E7ECEF; --ink2:#B2BCC5; --muted:#8A95A0; --line:#2C363F;
  --accent:#6DB7C9; --accent-ink:#0E1A1F; --accent-soft:#1B3038; --seal:#E26A5C; --ok:#6CC08A; --warn:#E3B24E; --warn-soft:#352D18; --ok-soft:#1C3125;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 6px 20px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html{font-size:var(--base)}
body{background:var(--bg);color:var(--ink);font-family:var(--font-ui);line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 3rem}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--surface);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--font-display);margin:0;text-wrap:balance;line-height:1.3}
a{color:var(--accent)}
.wrap{max-width:1180px;margin:0 auto}

/* 머리말 */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  margin-inline:calc(-1*max(16px,env(safe-area-inset-left,0px))) calc(-1*max(16px,env(safe-area-inset-right,0px)));
  padding-inline:max(16px,env(safe-area-inset-left,0px)) max(16px,env(safe-area-inset-right,0px))}
.top-in{max-width:1180px;margin:0 auto;display:flex;align-items:center;gap:.9rem;flex-wrap:wrap;padding:.7rem 0 .2rem}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.seal{width:2.5rem;height:2.5rem;flex:none;border:2px solid var(--seal);border-radius:.3rem;color:var(--seal);display:grid;grid-template-rows:1fr 1fr;
  place-items:center;font-family:var(--font-display);font-weight:700;font-size:.95rem;line-height:1;transform:rotate(-3deg);background:transparent}
.seal span{display:block}
.brand b{font-family:var(--font-display);font-size:1.25rem;letter-spacing:.01em;white-space:nowrap}
.brand small{display:block;color:var(--muted);font-size:.72rem;line-height:1.2}
.chip{margin-left:auto;display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:.2rem .8rem;font-size:.82rem;color:var(--ink2);max-width:100%}
.chip i{width:.5rem;height:.5rem;border-radius:50%;background:var(--ok);display:inline-block}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:.5rem;overflow:hidden;background:var(--surface2)}
.seg button{border:0;background:transparent;padding:.2rem .65rem;font-size:.78rem;cursor:pointer;color:var(--ink2)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.segl{font-size:.75rem;color:var(--muted);margin-right:.3rem}
nav.tabs{display:flex;gap:.1rem;overflow-x:auto;max-width:1180px;margin:0 auto;scrollbar-width:thin}
nav.tabs button{flex:none;border:0;background:transparent;padding:.65rem .9rem;font-size:.95rem;cursor:pointer;color:var(--ink2);border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs button:hover{color:var(--ink)}
nav.tabs button[aria-current="page"]{color:var(--ink);font-weight:700;border-bottom-color:var(--seal)}
nav.tabs small{display:inline-block;margin-left:.3rem;font-size:.66rem;color:var(--muted);border:1px solid var(--line);border-radius:.6rem;padding:0 .4rem;vertical-align:middle}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:.3rem}

main{padding-top:1.6rem}
.h-title{font-size:1.7rem;margin-bottom:.3rem}
.lead{color:var(--ink2);margin:0 0 1.4rem;max-width:62ch}
.card{background:var(--surface);border:1px solid var(--line);border-radius:.8rem;padding:1.1rem 1.2rem;box-shadow:var(--shadow)}
.card + .card{margin-top:1rem}
.card h2{font-size:1.1rem;margin-bottom:.8rem;display:flex;align-items:center;gap:.5rem;flex-wrap:wrap}
.card h2 small{font-family:var(--font-ui);font-weight:400;color:var(--muted);font-size:.78rem}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem .9rem}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:.7rem .9rem}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:1.3rem;align-items:start}
.home-grid{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:1.3rem;align-items:start}
@media (max-width:900px){.split,.home-grid{grid-template-columns:minmax(0,1fr)}.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:520px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.chip{margin-left:0}}
label.f{display:block;min-width:0}
label.f>span{display:block;font-size:.8rem;color:var(--ink2);margin-bottom:.2rem}
label.f>em{display:block;font-style:normal;font-size:.72rem;color:var(--muted);margin-top:.2rem}
input[type=text],input[type=date],input[type=time],input[type=url],select,textarea{width:100%;min-width:0;border:1px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.45rem .6rem}
input:focus,select:focus,textarea:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:4.2rem;line-height:1.5}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.4rem;border:1px solid var(--accent);background:var(--accent);color:var(--accent-ink);border-radius:.55rem;padding:.45rem .9rem;font-size:.88rem;font-weight:700;cursor:pointer}
.btn:hover{filter:brightness(1.07)}
.btn.ghost{background:transparent;color:var(--accent);font-weight:500}
.btn.sm{padding:.2rem .6rem;font-size:.78rem}
.btn.danger{border-color:var(--seal);color:var(--seal);background:transparent}
.row{display:flex;gap:.5rem;flex-wrap:wrap;align-items:center}
.muted{color:var(--muted);font-size:.82rem}
.rk-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:.5rem}
.rk-stat{border:1px solid var(--line);border-radius:.6rem;padding:.55rem .7rem;display:flex;flex-direction:column;gap:.05rem;background:var(--surface)}
.rk-stat b{font-size:1.3rem;line-height:1.2}.rk-stat span{font-size:.84rem;font-weight:600;color:var(--ink)}.rk-stat small{font-size:.74rem;color:var(--muted)}
.rk-stat.bad{border-color:var(--seal)}.rk-stat.bad b{color:var(--seal)}.rk-stat.warn{background:var(--warn-soft)}.rk-stat.warn b{color:var(--warn)}
.note{background:var(--surface2);border:1px dashed var(--line);border-radius:.6rem;padding:.6rem .8rem;font-size:.83rem;color:var(--ink2)}

/* 홈 바로가기 */
.mods{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.7rem}
@media (max-width:520px){.mods{grid-template-columns:minmax(0,1fr)}}
.mod{all:unset;box-sizing:border-box;cursor:pointer;display:block;border:1px solid var(--line);border-radius:.7rem;padding:.8rem .9rem;background:var(--surface)}
.mod:hover{border-color:var(--accent)}
.mod:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mod b{display:block;font-family:var(--font-display);font-size:1.02rem}
.mod span{display:block;font-size:.8rem;color:var(--ink2);margin-top:.15rem}
.mod span.tag{display:inline-block;margin-top:0;margin-left:.4rem;font-size:.68rem}
.tag{display:inline-block;font-size:.68rem;border-radius:.6rem;padding:0 .5rem;margin-left:.4rem;vertical-align:middle;font-family:var(--font-ui);font-weight:500}
.tag.on{background:var(--ok-soft);color:var(--ok)}
.tag.link{background:var(--accent-soft);color:var(--accent)}
.tag.soon{background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.next{display:grid;grid-template-columns:auto 1fr;gap:.2rem .9rem;font-size:.92rem}
.next dt{color:var(--muted)} .next dd{margin:0}

/* 위원 표 */
.mem{display:grid;grid-template-columns:3.2rem minmax(0,1fr) minmax(0,1fr) auto;gap:.4rem;align-items:center;margin-bottom:.4rem}
.mem.head{font-size:.75rem;color:var(--muted);margin-bottom:.2rem}

/* 안건 카드 */
.ag{border:1px solid var(--line);border-radius:.7rem;padding:.8rem .9rem;background:var(--surface)}
.ag+.ag{margin-top:.7rem}
.ag-h{display:flex;gap:.5rem;align-items:center;margin-bottom:.5rem}
.ag-n{flex:none;width:1.8rem;height:1.8rem;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:.85rem}
.ag-h input{flex:1}
.ag-h select{width:auto}
.ag-tools{display:flex;gap:.3rem;margin-top:.5rem;justify-content:flex-end}

/* 미리보기 */
.pv-tabs{display:flex;gap:.3rem;flex-wrap:wrap;margin-bottom:.7rem}
.pv-tabs button{border:1px solid var(--line);background:var(--surface);border-radius:.5rem;padding:.3rem .8rem;font-size:.85rem;cursor:pointer;color:var(--ink2)}
.pv-tabs button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.pv-bar{display:flex;gap:.5rem;flex-wrap:wrap;margin-bottom:.8rem;align-items:center}
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid #cfd5d8;box-shadow:var(--shadow);padding:2rem 1.8rem;margin-bottom:1rem;font-size:.9rem;line-height:1.7;overflow-x:auto;
  font-family:'Noto Sans KR','Malgun Gothic',sans-serif}
.paper p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.paper table{border-collapse:collapse;width:100%;table-layout:fixed;margin:.4rem 0}
.paper td{border:1px solid #444;padding:.25rem .45rem;vertical-align:middle;overflow-wrap:anywhere}
.paper table.nob td{border:0}
.paper td p{white-space:pre-wrap}
.pgno{font-size:.7rem;color:var(--muted);margin:-.5rem 0 1rem;text-align:right}
.sms{width:100%;min-height:14rem;font-size:.95rem}
.chk{list-style:none;margin:0;padding:0;display:grid;gap:.5rem}
.chk li{display:flex;gap:.6rem;align-items:flex-start;border-radius:.6rem;padding:.55rem .75rem;font-size:.9rem}
.chk li.ok{background:var(--ok-soft)} .chk li.warn{background:var(--warn-soft)}
.chk b{flex:none;width:1.2rem;text-align:center}
.chk li.ok b{color:var(--ok)} .chk li.warn b{color:var(--warn)}
.toast{position:fixed;left:50%;bottom:calc(1.2rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:.6rem;font-size:.9rem;z-index:60;box-shadow:var(--shadow);max-width:90vw}
.road{margin:0;padding-left:1.2rem}
.road li{margin:.35rem 0}
@media (prefers-reduced-motion:no-preference){.card,.mod{transition:border-color .15s}}

/* 서류 공통 미리보기 */
.docv{font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:13px;line-height:1.5;color:var(--paper-ink)}
.docv p{margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.docv table{border-collapse:collapse;table-layout:fixed;margin:0;max-width:100%}
.docv table.jc-c{margin-left:auto;margin-right:auto}
.docv table.jc-r{margin-left:auto}
.docv td{border:1px solid #333;padding:2px 5px;vertical-align:middle;white-space:pre-wrap;overflow-wrap:anywhere}
.docv td.nob{border-color:transparent}
.docv td.dbl{border:3px double #333}
.docv td.db{border-bottom:3px double #333}
.paper.pborder{outline:1px solid #111;outline-offset:-12px}
.doc{background:var(--paper);border:1px solid #cfd5d8;box-shadow:var(--shadow);padding:2.2rem 2rem;overflow-x:auto}
.doc .pbreak{border-top:2px dashed #b9c2c7;margin:1.6rem -2rem 1.4rem;position:relative}
.doc .pbreak::after{content:"쪽 나눔";position:absolute;right:.6rem;top:-.8rem;font-size:10px;color:#7d878e;background:var(--paper);padding:0 .3rem}
.doc [contenteditable]{outline:none;cursor:text;border-radius:2px}
.doc [contenteditable]:hover{background:#eef6f8}
.doc [contenteditable]:focus{background:#e2f0f4;box-shadow:inset 0 0 0 2px #1D5B6B}
.doc .chg{background:#fff4c2}
.doc [id^="sp-h-"]{scroll-margin-top:9rem}
.sp-wrap{display:grid;grid-template-columns:250px minmax(0,1fr);gap:1.2rem;align-items:start}
.sp-side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 7.6rem);max-height:calc(100vh - 9rem);overflow:auto}
@media (max-width:900px){.sp-wrap{grid-template-columns:minmax(0,1fr)}.sp-side{position:static;max-height:none}}
.toc{display:grid;gap:.05rem;margin-top:.4rem}
.toc a{display:block;color:var(--ink2);text-decoration:none;font-size:.82rem;padding:.12rem .2rem;border-radius:.3rem}
.toc a:hover{background:var(--surface2);color:var(--ink)}
.toc a.h2{padding-left:1rem;font-size:.76rem;color:var(--muted)}
.legend{display:inline-block;width:.9rem;height:.9rem;background:#fff4c2;border:1px solid #e3cf75;vertical-align:-2px;border-radius:2px}
.kt{width:100%;border-collapse:collapse;font-size:.85rem}
.kt th,.kt td{border-bottom:1px solid var(--line);padding:.35rem .4rem;text-align:left;vertical-align:top}
.kt th{color:var(--muted);font-weight:500;font-size:.75rem}
.tag{white-space:nowrap}
.rl-hits{display:grid;gap:.35rem;max-height:18rem;overflow:auto}
.rl-hit{display:flex;gap:.6rem;align-items:center;justify-content:space-between;border:1px solid var(--line);border-radius:.5rem;padding:.4rem .6rem}
.rl-hit span{min-width:0}
.rl-hit small{display:block;color:var(--muted);font-size:.75rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:26rem}
.rl-cur{white-space:pre-wrap;font-family:inherit;font-size:.82rem;background:var(--surface2);border:1px solid var(--line);border-radius:.4rem;padding:.5rem;margin:.3rem 0 0;max-height:14rem;overflow:auto}
.rl-steps{margin:0;padding-left:1.3rem;display:grid;gap:.6rem}
.rl-steps p{margin:.2rem 0 0;font-size:.85rem;color:var(--ink2)}
.paper.land{font-size:.8rem}
.risk-frame{width:100%;height:78vh;border:1px solid var(--line);border-radius:.6rem;background:#fff}
.dg-sum{display:flex;flex-wrap:wrap;gap:.5rem;margin:0 0 1.1rem}.dg-sum span{background:var(--surface2);border:1px solid var(--line);border-radius:.6rem;padding:.35rem .65rem;font-size:.82rem}.dg-sum b{font-size:1rem;color:var(--ink)}
.dg-sec{margin:0 0 1.6rem}.dg-sec h3{font-size:1rem;margin:0 0 .5rem}.dg-sec h3 small{color:var(--muted);font-weight:400;font-size:.78rem;margin-left:.3rem}
.dg mark{background:var(--warn-soft);color:var(--warn);border-radius:.2rem;padding:0 .15rem;font-weight:600}
.tag.bad{background:var(--warn-soft);color:var(--warn)}
.dg-lv{border-left:3px solid var(--line);padding:.15rem 0 .15rem .75rem;margin:.7rem 0}.dg-lv.l1{border-color:var(--warn)}.dg-lv.l3{border-color:var(--accent)}
.dg-item{display:flex;gap:.6rem;align-items:flex-start;justify-content:space-between;padding:.45rem 0;border-bottom:1px solid var(--line);font-size:.86rem}.dg-item>div{min-width:0;overflow-wrap:anywhere}.dg-item p{margin:.15rem 0 0;color:var(--ink2)}.dg-item .btn,.dg-item>.tag{flex:none}
.bd-big{font-size:1rem;margin:0 0 .5rem}.bd-res .kt th{width:7.5rem;white-space:nowrap}
.kt.nw th,.kt.nw td{white-space:nowrap}
</style>
</head>

function saveFile(name,blob){
  var getDl=Promise.resolve(null);
  try{if(window.claude&&window.claude.use)getDl=window.claude.use('downloads');}catch(e){}
  return getDl.catch(function(){return null;}).then(function(dl){
    if(dl){
      return dl.save({filename:name,data:blob}).then(function(){toast('저장했습니다: '+name);},function(e){toast(e&&e.code==='declined'?'저장을 취소했습니다.':'이 화면에서는 저장할 수 없습니다. 복사 버튼을 이용해 주세요.');});
    }
    var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(a.href);},4000);
    toast('내려받았습니다: '+name);
  });
}
function copyText(t){
  function fb(){var ta=document.createElement('textarea');ta.value=t;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();var ok=false;try{ok=document.execCommand('copy');}catch(e){}ta.remove();toast(ok?'복사했습니다. 한글이나 카카오톡에 붙여넣으세요.':'복사하지 못했습니다. 글자를 직접 선택해 복사해 주세요.');}
  try{navigator.clipboard.writeText(t).then(function(){toast('복사했습니다. 한글이나 카카오톡에 붙여넣으세요.');},fb);}catch(e){fb();}
}

function plainOf(b){return b.t!=null?b.t:(b.r||[]).map(function(r){return r[0];}).join('');}
function cut(t,n){t=String(t).replace(/\s*\n\s*/g,' ').trim();return t.length>n?t.slice(0,n)+'…':t;}
function spFillList(){
  var out=[],h1='',h2='',h3='',cap='';
  SPT.forEach(function(b,i){
    if(b.k==='p'){
      var t=tokens(plainOf(b));
      if(b.h===1){h1=t;h2='';h3='';cap='';}else if(b.h===2){h2=t;h3='';cap='';}else if(b.h===3){h3=t;cap='';}
      else if(b.al==='center'&&b.b&&t.length<40&&/^\[표|^\[/.test(t)){cap=t;}
      if(b.e)out.push({k:String(i),loc:[h1,h2,h3].filter(Boolean).map(function(x){return cut(x,24);}).join(' > ')+' > 문장',cur:curVal(String(i))});
      return;
    }
    var ncol=b.w.length,occ=[],grid=[];
    b.rows.forEach(function(r,ri){
      occ[ri]=occ[ri]||{};grid[ri]=grid[ri]||{};var col=0;
      r.c.forEach(function(c,ci){
        while(occ[ri][col])col++;
        var cs=c.cs||1,rs=c.rs||1;
        for(var q=0;q<rs;q++){occ[ri+q]=occ[ri+q]||{};grid[ri+q]=grid[ri+q]||{};for(var j=0;j<cs;j++){occ[ri+q][col+j]=true;grid[ri+q][col+j]={c:c,ri:ri,ci:ci};}}
        c._lc=col;col+=cs;
      });
    });
    var hdr=0;while(hdr<b.rows.length&&(b.rows[hdr].hd||b.rows[hdr].c.every(function(c){return c.f;})))hdr++;
    function colHead(lc){var a=[];for(var r=0;r<hdr;r++){var g=grid[r]&&grid[r][lc];if(g){var t=cut(tokens(g.c.t||''),18);if(t&&a.indexOf(t)<0)a.push(t);}}return a.join(' ');}
    var where=[h1,h2,h3||cap].filter(Boolean).map(function(x){return cut(x,24);}).join(' > ');
    b.rows.forEach(function(r,ri){
      r.c.forEach(function(c,ci){
        if(!c.e)return;
        var lc=c._lc,left='';
        for(var x=lc-1;x>=0&&!left;x--){var g=grid[ri][x];if(g&&g.c!==c){var t=cut(tokens(g.c.t||''),18);if(t&&!/^\d{1,3}$/.test(t))left=t;else if(t&&x===0)left=t+'번';}}
        var parts=[colHead(lc),left].filter(Boolean);
        out.push({k:i+'.'+ri+'.'+ci,loc:where+(parts.length?' > '+parts.join(' · '):''),cur:curVal(i+'.'+ri+'.'+ci)});
      });
    });
  });
  return out;
}

function aiApply(text){
  var valid={};spFillList().forEach(function(x){valid[x.k]=1;});
  SPT.forEach(function(b,i){if(b.k==='p'&&!b.h)valid[String(i)]=valid[String(i)]||2;else if(b.k==='t')b.rows.forEach(function(r,ri){r.c.forEach(function(c,ci){if(c.t!=null)valid[i+'.'+ri+'.'+ci]=valid[i+'.'+ri+'.'+ci]||2;});});});
  var ok=0,skip=0,before=JSON.parse(JSON.stringify(state.safety.edits));
  String(text).replace(/\r/g,'').split('\n').forEach(function(line){
    var m=line.match(/^\s*[`*\-]*\s*(\d+(?:\.\d+\.\d+)?)\s*[=:]\s*(.*?)\s*$/);
    if(!m)return;
    var k=m[1],v=m[2].replace(/\\n/g,'\n').replace(/^["“](.*)["”]$/,'$1');

    ok++;
  });

  return {ok:ok,skip:skip};
}

function kNum(v){var n=Number(String(v).replace(/,/g,''));return isFinite(n)&&String(v).trim()!==''?n.toLocaleString('ko-KR'):v;}

/* 파일에서 글자 꺼내기 (.txt .docx .hwpx) */
function readRuleFile(file){
  var name=(file.name||'').toLowerCase();
  if(/\.txt$/.test(name))return file.text();
  if(typeof JSZip==='undefined')return Promise.reject(new Error('jszip'));
  return file.arrayBuffer().then(function(buf){return JSZip.loadAsync(buf);}).then(function(z){
    if(/\.docx$/.test(name)){return z.file('word/document.xml').async('string').then(function(x){
      return x.split(/<\/w:p>/).map(function(p){return (p.match(/<w:t[^>]*>([^<]*)<\/w:t>/g)||[]).map(function(t){return t.replace(/<[^>]+>/g,'');}).join('');}).join('\n');});}
    if(/\.hwpx$/.test(name)){
      var files=Object.keys(z.files).filter(function(f){return /Contents\/section\d+\.xml$/.test(f);}).sort();
      return Promise.all(files.map(function(f){return z.file(f).async('string');})).then(function(xs){
        return xs.map(function(x){return x.split(/<\/hp:p>/).map(function(p){return (p.match(/<hp:t[^>]*>([^<]*)<\/hp:t>/g)||[]).map(function(t){return t.replace(/<[^>]+>/g,'');}).join('');}).join('\n');}).join('\n');});
    }
    throw new Error('형식');
  }).then(function(t){return t.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&quot;/g,'"').replace(/&#39;/g,"'").replace(/&amp;/g,'&');});
}

function rulesChecks(){
  var r=R(),p=r.proc,out=[];
  out.push({ok:!!r.base,t:r.base?'현행 관리규약 조문 '+r.base.arts.length+'개를 넣었습니다.':'현행 관리규약을 아직 넣지 않았습니다.'});
  out.push({ok:r.am.length>0,t:r.am.length?'개정할 조문이 '+r.am.length+'개입니다.':'개정할 조문이 없습니다.'});
  r.am.forEach(function(a){
    if(a.type==='개정'&&String(a.next).trim()===String(a.cur).trim()&&(a.nextTitle||a.title)===a.title)out.push({ok:false,t:amLabel(a)+': 개정(안)이 현행과 같습니다.'});
    if(!String(a.reason||'').trim())out.push({ok:false,t:amLabel(a)+': 개정 사유가 비어 있습니다.'});
    if(a.type==='신설'&&r.base&&r.base.arts.some(function(x){return x.k===a.k;}))out.push({ok:false,t:amLabel(a)+': 이미 있는 조문 번호입니다. 번호를 바꾸거나 "개정"으로 하세요.'});
  });
  if(r.base){
    var c=RC.checkRefs(r.base.arts,r.am);
    c.toDeleted.forEach(function(x){out.push({ok:false,t:RC.label(x.from)+'에 삭제되는 '+RC.refLabel(x.to)+' 인용이 있습니다. 함께 고쳐야 하는지 확인하세요.'});});
    c.unknown.forEach(function(x){out.push({ok:false,t:x.head+' 개정(안)에 규약에 없는 '+RC.refLabel(x.ref)+'가 나옵니다. 법령 조문이면 괜찮고, 규약 조문이면 번호를 확인하세요.'});});
    if(!c.toDeleted.length&&!c.unknown.length&&r.am.length)out.push({ok:true,t:'조문 번호 인용에서 어긋나는 곳을 찾지 못했습니다.'});
  }
  if(!state.complex.region)out.push({ok:false,t:'시·도를 고르면 준칙 이름이 맞게 들어갑니다(홈의 단지 정보 또는 ② 지역 준칙).'});
  if(r.jun.arts){var jr=junRows(),usedK={},usedT={};r.am.forEach(function(a){usedK[a.k]=1;usedT[RC.normT(a.nextTitle||a.title)]=1;});var nd=jr.filter(function(x){return x.st==='다름'&&!usedK[x.b.k];}).length,no=jr.filter(function(x){return x.st==='준칙에만'&&!usedT[RC.normT(x.j.title)];}).length;out.push({ok:!nd&&!no,t:(nd||no)?'준칙 대조: 아직 검토하지 않은 다른 조문 '+nd+'개, 준칙에만 있는 조문 '+no+'개가 있습니다. "준칙 대조" 탭에서 반영할지 정하세요.':'준칙 대조: 다른 조문은 모두 개정 대상에 넣었거나 검토했습니다.'});}
  out.push({ok:!!lines(p.purpose).length,t:lines(p.purpose).length?'공고 기재사항 1: 개정 목적이 입력되어 있습니다.':'공고 기재사항 1: 개정 목적을 입력하세요(시행령 제20조제5항제1호).'});
  out.push({ok:!!lines(p.junDiff).length,t:lines(p.junDiff).length?'공고 기재사항 3: 준칙과 달라진 내용이 입력되어 있습니다.':'공고 기재사항 3: 관리규약준칙과 달라진 내용을 입력하세요. 없으면 "없음"으로 적습니다(제20조제5항제3호).'});
  var ds=[p.boardDate,p.noticeDate,p.voteStart,p.voteEnd].map(parseIso);
  if(ds.every(Boolean)){var okOrder=ds[0].t<=ds[1].t&&ds[1].t<=ds[2].t&&ds[2].t<=ds[3].t;out.push({ok:okOrder,t:okOrder?'의결일, 공고일, 찬반 기간의 순서가 맞습니다.':'의결일 → 공고일 → 찬반 시작 → 찬반 종료 순서가 맞지 않습니다.'});}
  else out.push({ok:false,t:'의결일, 공고일, 찬반 기간을 입력하면 일정과 신고 기한을 계산합니다.'});
  return out;
}

    else if(/(사본|증명서|\d\s*부\b|제출)/.test(s)&&!/(자본금|실적)/.test(s))return;
    if(s.length<6||s.length>220||/제\s*(26|18)\s*조|참가자격의\s*제한|공고문\s*참조|첨부/.test(s))return;
    var key=s.replace(/\s/g,'');if(seen[key])return;seen[key]=1;
    var t=/(산출|노무비|최저임금|일반관리비|이윤|단가|퇴직|4대\s*보험|사회보험)/.test(s)?'calc':/(자본금|실적|세대\s*이상|단지\s*이상|기술\s*인력|보유)/.test(s)?'lim':'qual';

    else if(/([가-힣·]+업)\s*(등록증|허가증|신고증|신고필증|면허증)/.test(s))push(s);

function wageCalc(b){
  var w=b.wage,h=num(w.hourly),rate=(num(w.pension)+num(w.health)+num(w.health)*num(w.ltc)/100+num(w.emp)+num(w.acc))/100;
  var exp=num(w.uniform)+num(w.supplies)+num(w.edu)+num(w.check);
  var rows=b.staff.map(function(s){var n=num(s.n)||0,base=h*num(s.monthH),night=h*0.5*num(s.nightH),ann=w.annual?h*num(s.dayH)*15/12:0;
    var wages=base+night+ann,sev=wages/12,ins=wages*rate,labor=wages+sev+ins,per=labor+exp;
    return {s:s,n:n,base:base,night:night,ann:ann,wages:wages,sev:sev,ins:ins,labor:labor,exp:exp,per:per,tot:per*n,ltot:labor*n};});
  var labor=rows.reduce(function(a,r){return a+r.ltot;},0),direct=rows.reduce(function(a,r){return a+r.tot;},0);
  var mg=labor*num(w.mgmt)/100,pf=labor*num(w.profit)/100,month=Math.floor(direct+mg+pf);
  return {rows:rows,rate:rate,labor:labor,direct:direct,mg:mg,pf:pf,month:month};
}

function scoreCalc(b){
  var J=BD.judge(b),hi=J.award==='최고낙찰제'||BD.kind(b.kind).aw.indexOf('최고낙찰제')>=0;
  var pi=(b.eval||[]).filter(function(x){return x.k==='price';})[0],pts=pi?evalCritPts(pi.crit):[30];
  var cos=b.cos.map(function(c,i){return {i:i,c:c,price:num(c.price)};});
  var sorted=cos.filter(function(x){return x.price;}).slice().sort(function(a,z){return hi?z.price-a.price:a.price-z.price;});
  var rank={},r=0,last=null;sorted.forEach(function(x,j){if(x.price!==last){r=j+1;last=x.price;}rank[x.i]=r;});
  cos.forEach(function(x){x.pr=rank[x.i]?pts[Math.min(rank[x.i]-1,pts.length-1)]:0;x.tot=x.pr;(b.eval||[]).forEach(function(e){if(e.k!=='price')x.tot+=num((x.c.s||{})[e.k]);});x.tot=Math.round(x.tot*10)/10;});
  var ord=cos.slice().sort(function(a,z){return z.tot-a.tot||(hi?z.price-a.price:a.price-z.price);});
  ord.forEach(function(x,j){x.rk=j+1;});
  var tie=ord.length>1&&ord[0].tot===ord[1].tot&&ord[0].price===ord[1].price;
  return {cos:cos,ord:ord,tie:tie,hi:hi};
}

function onImport(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){try{var o=JSON.parse(r.result);if(!o||o.v!==1||!o.complex)throw 0;state=merge(defaultState(),o);saveNow();applyFont();paintFont();updateChip();go('home',true);toast('저장 파일을 불러왔습니다.');}catch(x){toast('이 허브에서 만든 저장 파일이 아닙니다.');}};
  r.readAsText(f);
}

/* ───────── 시작 ───────── */
applyFont();shell();
var h0=(location.hash||'').replace('#','');
go(h0||'home',true);
window.addEventListener('hashchange',function(){var x=(location.hash||'').replace('#','');if(x&&x!==tab)go(x,true);});
window.addEventListener('beforeunload',saveNow);
})();
</script>
